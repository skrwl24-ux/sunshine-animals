<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sunshine Animals</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;color:#173d32;min-height:100vh;background:linear-gradient(#073b5370,#0b433660),url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=2200&q=88') center/cover fixed}button{font:inherit;cursor:pointer}.top{position:fixed;z-index:30;inset:14px 14px auto;display:flex;justify-content:space-between;pointer-events:none}.logo,.hud>*{pointer-events:auto;background:#fffef4ef;border:1px solid white;border-radius:18px;box-shadow:0 8px 28px #092c2650}.logo{padding:10px 15px;font-weight:950}.logo small{display:block;font-size:8px;letter-spacing:1.8px;color:#71837d}.hud{display:grid;gap:5px;text-align:center}.light{padding:9px 14px;font-weight:900}.lang{border:1px solid #cce4db;background:#123e38;color:white;border-radius:999px;padding:7px 15px}.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:95px 15px 90px;position:relative;overflow:hidden}.stage:after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,#fff7a74d,transparent 25%);pointer-events:none}.wild{position:absolute;font-size:clamp(70px,10vw,160px);filter:drop-shadow(0 15px 15px #0006);z-index:1}.w1{left:4%;bottom:9%}.w2{left:23%;bottom:2%}.w3{right:22%;bottom:2%}.w4{right:4%;bottom:8%}.w5{top:10%;left:44%;font-size:clamp(100px,18vw,260px)}.home{z-index:3;text-align:center;width:min(700px,92vw)}.tag,.hint{display:inline-block;background:#fffde9e8;border-radius:999px;padding:8px 13px;font-weight:800;font-size:13px}.home h1{font-size:clamp(34px,5vw,65px);line-height:1.12;margin:15px 0;text-shadow:0 2px 0 #fff,0 4px 20px #fff}.hint{background:#ffffffe5}.activities{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:18px auto 12px}.activity{background:#fffef0ef;border:1px solid white;border-radius:18px;padding:14px;text-align:left;box-shadow:0 8px 30px #173b3040}.activity b{display:block;margin-bottom:5px}.eggs{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(430px,100%);margin:auto}.eggCard{border:2px solid white;background:#f8fff9ef;border-radius:18px;padding:13px;box-shadow:0 10px 30px #123b3040}.eggCard.aurora{border-color:#b65cff;background:#f7efffff}.egg{font-size:82px;filter:drop-shadow(0 9px 10px #18352f35)}.five{font-size:12px;margin-top:8px}.bottom{position:fixed;z-index:40;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:3px;background:#f8fff8ef;border:1px solid white;border-radius:18px;padding:6px;box-shadow:0 8px 30px #092c2650;max-width:96vw;overflow:auto}.bottom button{white-space:nowrap;border:0;background:transparent;border-radius:13px;padding:10px 13px;font-weight:850;color:#24463d}.bottom button.active{background:#fff8bd}.screen{position:fixed;z-index:20;inset:0;background:#0b2f2875;backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:65px 14px 80px}.hide{display:none!important}.panel{width:min(660px,94vw);max-height:82vh;overflow:auto;background:#ffffffed;border:8px solid #ffffffc9;border-radius:28px;padding:20px;box-shadow:0 25px 80px #0007}.back{border:1px solid #5d987e;background:white;border-radius:50%;width:42px;height:42px}.hatchbox{text-align:center;background:linear-gradient(#effff3e8,#fffbd7e8);border-radius:22px;padding:30px}.hatchEgg{font-size:120px;animation:float 2s infinite}@keyframes float{50%{transform:translateY(-9px)}}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}.card{background:#fff;border:3px solid #5baa67;border-radius:18px;padding:9px;text-align:center}.card .animal{font-size:58px}.locked{filter:grayscale(1);opacity:.35}.answers{display:grid;gap:9px}.answers button,.action{border:1px solid #d7e9df;background:#f8fff9;border-radius:14px;padding:13px;font-weight:800}.modal{position:fixed;z-index:60;inset:0;background:#061d18b8;display:flex;align-items:center;justify-content:center;padding:15px}.result{width:min(480px,94vw);background:white;border:7px solid white;border-radius:28px;padding:18px;text-align:center}.resultAnimal{font-size:100px}.resultCard{border:4px solid #59a965;border-radius:20px;padding:15px;background:#fff}.bar{height:12px;background:#e5eee9;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:#62b879}@media(max-width:700px){.wild{opacity:.7}.w5{top:16%}.activities{grid-template-columns:1fr}.activity{padding:10px}.home h1{font-size:36px}.eggs{width:100%}.egg{font-size:65px}.bottom button{font-size:12px;padding:9px}.top{inset:8px 8px auto}.logo{padding:8px 10px}.stage{padding-top:120px}}</style></head><body><script src="game-data.js"></script><div class="top"><div class="logo">🌞 선샤인 애니멀즈<small>SUNSHINE ANIMALS</small></div><div class="hud"><div class="light">✨ <span id="lightLabel">자연의 빛</span>　<span id="light">53</span></div><button class="lang" onclick="toggleLang()">🌎 <span id="langBtn">English</span></button></div></div><main class="stage"><div class="wild w1">🦝</div><div class="wild w2">🐆</div><div class="wild w3">🦊</div><div class="wild w4">🐧</div><div class="wild w5">🐋</div><section class="home"><div class="tag" id="tag">✨ 자연의 빛이 새로운 생명을 깨워요</div><h1 id="hero">빛 속에서 깨어날<br>동물 친구를 만나보세요</h1><div class="hint" id="hint">마음에 드는 알을 누르면 동물 카드 한 장을 만날 수 있어요.</div><div class="activities"><button class="activity" onclick="openScreen('quiz')">🧠 <b id="quizTitle">퀴즈 풀기</b><small id="quizSub">정답을 맞히면 자연의 빛 모으기</small></button><button class="activity" onclick="openScreen('party')">🎉 <b>애니멀파티</b><small>같은 동물 찾고 자연의 빛 받기</small></button><button class="activity" onclick="openScreen('rescue')">🛟 <b>애니멀 구조대</b><small>동물 친구 구조하기</small></button></div><div class="eggs"><button class="eggCard" onclick="hatch(5,1,false)"><b>PEARL</b><div class="egg">🥚</div><strong>숲의 알</strong><div>✨ 5 · 1회 부화</div><div class="five" onclick="event.stopPropagation();hatch(5,5,false)">숲의 알 5회 연속 부화 · ✨25</div></button><button class="eggCard aurora" onclick="hatch(10,1,true)"><b>AURORA</b><div class="egg">🌈</div><strong>빛나는 알</strong><div>✨ 10 · 희귀 확률 UP</div><div class="five" onclick="event.stopPropagation();hatch(10,5,true)">빛나는 알 5회 연속 부화 · ✨50</div></button></div></section></main><nav class="bottom"><button class="active" onclick="closeScreens()">🥚 알 부화</button><button onclick="openScreen('quiz')">🧠 동물 퀴즈</button><button onclick="openScreen('party')">🎉 애니멀 파티</button><button onclick="openScreen('rescue')">🛟 구조대</button><button onclick="openScreen('quest')">🎯 특별 퀘스트</button><button onclick="openScreen('book')">📖 나의 도감</button></nav><div id="screen" class="screen hide"><section class="panel"><button class="back" onclick="closeScreens()">←</button><div id="content"></div></section></div><div id="modal" class="modal hide"><section class="result"><div id="rbody"></div><button class="action" onclick="closeModal()">확인</button></section></div><script>const A=GAME_DATA.animals,Q=GAME_DATA.quizzes,$=x=>document.getElementById(x);let lang=localStorage.sunLang||'ko',light=+(localStorage.sunLight||53),owned=JSON.parse(localStorage.sunOwned||'[]'),qdone=+(localStorage.sunQ||0),pair=null,busy=false;function T(a,b){return lang==='ko'?a:b}function save(){localStorage.sunLang=lang;localStorage.sunLight=light;localStorage.sunOwned=JSON.stringify(owned);localStorage.sunQ=qdone;render()}function render(){$('light').textContent=light;$('langBtn').textContent=lang==='ko'?'English':'한국어';$('lightLabel').textContent=T('자연의 빛','Nature Light');$('tag').textContent='✨ '+T('자연의 빛이 새로운 생명을 깨워요','Nature Light awakens new life');$('hero').innerHTML=T('빛 속에서 깨어날<br>동물 친구를 만나보세요','Meet animal friends<br>awakening in the light');$('hint').textContent=T('마음에 드는 알을 누르면 동물 카드 한 장을 만날 수 있어요.','Choose an egg to discover a new animal card.')}function toggleLang(){lang=lang==='ko'?'en':'ko';save()}function closeScreens(){$('screen').classList.add('hide')}function openScreen(type){$('screen').classList.remove('hide');if(type==='quiz')quiz();if(type==='party')party();if(type==='rescue')rescue();if(type==='quest')quest();if(type==='book')book()}function pickAnimal(up){let r=Math.random(),tier=up?(r<.08?4:r<.20?3:r<.42?2:r<.70?1:0):(r<.03?4:r<.11?3:r<.28?2:r<.55?1:0),s=[0,55,82,100,110][tier],e=[55,82,100,110,115][tier];return s+Math.floor(Math.random()*(e-s))}function hatch(cost,n,up){let total=cost*n;if(light<total)return need(total-light);light-=total;let got=[];for(let i=0;i<n;i++){let x=pickAnimal(up);got.push(x);if(!owned.includes(x))owned.push(x)}save();$('screen').classList.remove('hide');$('content').innerHTML='<div class="hatchbox"><b>🥚 '+T('부화 직전!','Ready to hatch!')+'</b><div class="hatchEgg">'+(up?'🌈':'🥚')+'</div><h3>'+T('알을 눌러 부화시켜 보세요','Tap the egg to hatch')+'</h3></div>';$('content').querySelector('.hatchEgg').onclick=()=>showResult(got)}function showResult(got){let x=got[0],a=A[x];$('rbody').innerHTML='<p>🌱 '+T('알에서 동물 카드 발견!','Animal card discovered!')+'</p><div class="resultCard"><div class="resultAnimal">'+a[2]+'</div><h2>'+a[lang==='ko'?0:1]+'</h2><b>★ '+T(x>109?'환상':x>99?'전설':x>81?'특별':x>54?'희귀':'일반',x>109?'Mythic':x>99?'Legendary':x>81?'Special':x>54?'Rare':'Common')+'</b><p>'+(got.length>1?T('외 '+(got.length-1)+'마리도 도감에 추가됐어요.','Plus '+(got.length-1)+' more added to your book.'):'')+'</p></div>';$('modal').classList.remove('hide')}function need(n){$('rbody').innerHTML='<div class="resultAnimal">✨</div><h2>'+T('자연의 빛이 '+n+'개 부족해요','Need '+n+' more Nature Light')+'</h2><div class="answers"><button onclick="closeModal();openScreen(\'quiz\')">🧠 Quiz +5</button><button onclick="closeModal();openScreen(\'party\')">🎉 Party +3</button><button onclick="closeModal();openScreen(\'rescue\')">🛟 Rescue +4</button></div>';$('modal').classList.remove('hide')}function closeModal(){$('modal').classList.add('hide')}function quiz(){let q=Q[qdone%Q.length],opts=(lang==='ko'?[q[2],q[3],q[4]]:[q[5],q[6],q[7]]).map((v,i)=>[v,i]).sort(()=>Math.random()-.5);$('content').innerHTML='<h2>🧠 '+T('동물 퀴즈','Animal Quiz')+' '+(qdone%50+1)+'/50</h2><h3>'+(lang==='ko'?q[0]:q[1])+'</h3><div class="answers">'+opts.map(o=>'<button onclick="answer('+o[1]+')">'+o[0]+'</button>').join('')+'</div>'}function answer(i){if(i===0){light+=5;alert(T('정답! 자연의 빛 +5','Correct! Nature Light +5'))}else alert(T('아쉬워요! 다음 문제에 도전!','Nice try! Next question!'));qdone++;save();quiz()}function party(){pair=null;let ids=[...Array(6)].map(()=>Math.floor(Math.random()*A.length)),deck=[...ids,...ids].sort(()=>Math.random()-.5);$('content').innerHTML='<h2>🎉 Animal Party</h2><p>'+T('같은 동물 두 장을 맞히면 ✨ +3','Match two animals for ✨ +3')+'</p><div class="grid">'+deck.map(i=>'<button class="card" data-i="'+i+'" onclick="flip(this)"><div class="animal">❔</div></button>').join('')+'</div>'}function flip(e){if(busy||e.dataset.done)return;let i=+e.dataset.i;e.firstChild.textContent=A[i][2];if(!pair){pair=e;return}if(pair===e)return;if(pair.dataset.i===e.dataset.i){pair.dataset.done=e.dataset.done=1;light+=3;pair=null;save()}else{busy=true;let p=pair;setTimeout(()=>{p.firstChild.textContent=e.firstChild.textContent='❔';pair=null;busy=false},550)}}function rescue(){let t=Math.floor(Math.random()*A.length),ids=[t,...[...Array(A.length).keys()].filter(i=>i!==t).sort(()=>Math.random()-.5).slice(0,11)].sort(()=>Math.random()-.5);$('content').innerHTML='<h2>🛟 '+T('애니멀 구조대','Animal Rescue')+'</h2><h3>'+T(A[t][0]+'를 찾아 구조하세요!','Find and rescue the '+A[t][1]+'!')+'</h3><div class="grid">'+ids.map(i=>'<button class="card" onclick="doRescue('+i+','+t+')"><div class="animal">'+A[i][2]+'</div></button>').join('')+'</div>'}function doRescue(i,tg){if(i===tg){light+=4;save();alert(T('구조 성공! +4','Rescue complete! +4'));rescue()}else alert(T('다른 동물이에요!','Try another animal!'))}function quest(){let a=Math.min(qdone,10),b=Math.min(owned.length,50);$('content').innerHTML='<h2>🎯 '+T('특별 퀘스트','Quests')+'</h2><h3>🧠 Quiz '+a+'/10</h3><div class="bar"><i style="width:'+a*10+'%"></i></div><h3>📖 Collection '+b+'/50</h3><div class="bar"><i style="width:'+b*2+'%"></i></div><h3>✨ Nature Light '+light+'/100</h3>'}function book(){$('content').innerHTML='<h2>📖 '+T('나의 도감','My Book')+' · '+owned.length+'/115</h2><div class="grid">'+A.map((a,i)=>'<div class="card '+(owned.includes(i)?'':'locked')+'"><div class="animal">'+(owned.includes(i)?a[2]:'❔')+'</div><b>'+(owned.includes(i)?a[lang==='ko'?0:1]:'???')+'</b></div>').join('')+'</div>'}render();</script></body></html>
