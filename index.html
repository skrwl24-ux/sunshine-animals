<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sunshine Animals</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:radial-gradient(circle at 10% 5%,#fff0a8,transparent 25%),linear-gradient(155deg,#effff7,#fff9df);color:#173b31}header{padding:12px;background:#103e34ee;color:#fff;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:9;backdrop-filter:blur(12px)}.hud{display:flex;gap:7px}.pill,button{border:0;border-radius:16px;padding:11px;font-weight:850}.pill{background:#ffe779;color:#594700}.lang{background:#ffffff20;color:white}main{max-width:980px;margin:auto;padding:12px 12px 80px}.hero{text-align:center;padding:25px;background:linear-gradient(145deg,#164d41,#2b8068);color:white;border-radius:29px;box-shadow:0 16px 45px #164a3625}.sun{font-size:68px;filter:drop-shadow(0 0 18px #ffe568)}.nav{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin:10px 0}.nav button,.panel,button{background:#ffffffe8}.panel{padding:18px;border-radius:25px;margin-top:10px;box-shadow:0 10px 30px #174d3512}.hide{display:none}.eggs,.earn{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.earn{grid-template-columns:repeat(3,1fr);margin-bottom:12px}.egg{font-size:65px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:9px}.card{background:#fff;border:2px solid #e4eee8;border-radius:19px;padding:10px;text-align:center}.animal{font-size:45px}.locked{opacity:.35;filter:grayscale(1)}.answers,.choices{display:grid;gap:8px}.answers button{text-align:left}.modal{position:fixed;inset:0;background:#001d17cc;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20;backdrop-filter:blur(7px)}.box{background:linear-gradient(160deg,#fff,#f2fff8);border-radius:28px;padding:23px;max-width:460px;width:100%;text-align:center}.big{font-size:70px}.rarity{font-size:12px;color:#b88700}@media(max-width:650px){.nav{grid-template-columns:repeat(3,1fr)}.eggs,.earn{grid-template-columns:1fr}}</style></head><body><header><b>☀️ SUNSHINE ANIMALS</b><div class="hud"><span class="pill">✨ <span id="light">40</span></span><button class="lang" onclick="toggleLang()" id="lang">English</button></div></header><main><div class="hero"><div class="sun">☀️</div><h1 id="title"></h1><p id="sub"></p><b id="count"></b></div><div class="nav"><button onclick="go('eggs')">🥚 <span id="nEgg">알</span></button><button onclick="go('quiz')">🧠 Quiz</button><button onclick="go('party')">🎉 Party</button><button onclick="go('rescue')">🛟 Rescue</button><button onclick="go('quest')">🎯 Quest</button><button onclick="go('book')">📖 Book</button></div><section id="eggs" class="panel"><h2>✨ Nature Light</h2><p id="egghelp"></p><div class="earn"><button onclick="go('quiz')">🧠 Quiz +5</button><button onclick="go('party')">🎉 Party +3</button><button onclick="go('rescue')">🛟 Rescue +4</button></div><div class="eggs"><button onclick="hatch(5,1)"><div class="egg">🥚</div><b>Forest Egg</b><br>✨5 ×1</button><button onclick="hatch(10,1)"><div class="egg">🌈</div><b>Shining Egg</b><br>✨10 ×1</button><button onclick="hatch(5,5)"><div class="egg">🥚🥚</div><b>Forest ×5</b><br>✨25</button><button onclick="hatch(10,5)"><div class="egg">🌈🌈</div><b>Shining ×5</b><br>✨50</button></div></section><section id="quiz" class="panel hide"><h2>🧠 Animal Quiz <small id="qcount"></small></h2><div id="quizbox"></div></section><section id="party" class="panel hide"><h2>🎉 Animal Party</h2><p id="partyhelp"></p><div id="partygrid" class="grid"></div></section><section id="rescue" class="panel hide"><h2>🛟 Animal Rescue</h2><p id="rescuehelp"></p><div id="rescuegrid" class="grid"></div></section><section id="quest" class="panel hide"><h2>🎯 Quests</h2><div id="questbox"></div></section><section id="book" class="panel hide"><h2>📖 My Discovery Book</h2><div id="grid" class="grid"></div></section></main><div id="modal" class="modal hide"><div class="box"><div id="micon" class="big"></div><h2 id="mname"></h2><p id="mtext"></p><div id="mextra"></div><br><button onclick="closeM()">OK</button></div></div><script src="game-data.js"></script><script>let lang=localStorage.saLang||'ko',light=+(localStorage.saLight||40),owned=JSON.parse(localStorage.saOwned||'[]'),qdone=+(localStorage.saQ||0),pick=null,lock=false;const animals=GAME_DATA.animals,qs=GAME_DATA.quizzes,$=x=>document.getElementById(x),T=(a,b)=>lang==='ko'?a:b;function save(){localStorage.saLang=lang;localStorage.saLight=light;localStorage.saOwned=JSON.stringify(owned);localStorage.saQ=qdone;render()}function render(){$('light').textContent=light;$('lang').textContent=lang==='ko'?'English':'한국어';$('title').textContent=T('선샤인 애니멀즈','SUNSHINE ANIMALS');$('sub').textContent=T('빛을 모으고 알을 깨워 놀라운 동물을 발견하세요!','Collect light, hatch eggs and discover amazing animals!');$('egghelp').textContent=T('빛이 부족하면 아래 무료 활동으로 바로 모을 수 있어요.','Need Light? Earn it through the free activities below.');$('partyhelp').textContent=T('같은 동물 두 장을 맞히면 자연의 빛 +3!','Match two animals to earn +3 Nature Light!');$('count').textContent=T('도감 '+owned.length+'/'+animals.length+' · 퀴즈 50','Collection '+owned.length+'/'+animals.length+' · 50 quizzes');$('grid').innerHTML=animals.map((a,i)=>`<div class="card ${owned.includes(i)?'':'locked'}"><div class="animal">${owned.includes(i)?a[2]:'❔'}</div><b>${owned.includes(i)?a[lang==='ko'?0:1]:'???'}</b><div class="rarity">${'★'.repeat(1+i%5)}</div></div>`).join('')}function toggleLang(){lang=lang==='ko'?'en':'ko';save()}function go(id){['eggs','quiz','party','rescue','quest','book'].forEach(x=>$(x).classList.toggle('hide',x!==id));if(id==='quiz')quiz();if(id==='party')party();if(id==='rescue')rescue();if(id==='quest')quest();render()}function hatch(c,n){let total=c*n;if(light<total)return need(total);light-=total;let got=[];for(let k=0;k<n;k++){let i=Math.floor(Math.random()*animals.length);got.push(i);if(!owned.includes(i))owned.push(i)}save();$('micon').textContent=got.map(i=>animals[i][2]).join(' ');$('mname').textContent=T('✨ 부화 성공!','✨ Hatch complete!');$('mtext').textContent=got.map(i=>animals[i][lang==='ko'?0:1]).join(' · ');$('modal').classList.remove('hide')}function need(t){$('micon').textContent='✨';$('mname').textContent=T('자연의 빛이 부족해요','Need more Nature Light');$('mtext').textContent=T((t-light)+'개 더 필요해요. 원하는 활동을 골라주세요.','Need '+(t-light)+' more. Choose an activity.');$('mextra').innerHTML='<div class="choices"><button onclick="closeM();go(\'quiz\')">🧠 Quiz +5</button><button onclick="closeM();go(\'party\')">🎉 Animal Party +3</button><button onclick="closeM();go(\'rescue\')">🛟 Rescue +4</button></div>';$('modal').classList.remove('hide')}function closeM(){$('modal').classList.add('hide');$('mextra').innerHTML=''}function quiz(){let q=qs[qdone%qs.length],ko=lang==='ko',opts=(ko?[q[2],q[3],q[4]]:[q[5],q[6],q[7]]).map((v,i)=>[v,i]).sort(()=>Math.random()-.5);$('qcount').textContent=(qdone%50+1)+'/50';$('quizbox').innerHTML='<h3>'+(ko?q[0]:q[1])+'</h3><div class="answers">'+opts.map(o=>`<button onclick="answer(${o[1]})">${o[0]}</button>`).join('')+'</div><p>✨ +5</p>'}function answer(i){if(i===0){light+=5;alert(T('정답! 자연의 빛 +5','Correct! Nature Light +5'))}else alert(T('아쉬워요! 다음 문제에 도전하세요.','Not quite! Try the next one.'));qdone++;save();quiz()}function party(){pick=null;let pool=[...Array(animals.length).keys()].sort(()=>Math.random()-.5).slice(0,6),arr=[...pool,...pool].sort(()=>Math.random()-.5);$('partygrid').innerHTML=arr.map(i=>`<div class="card" data-i="${i}" onclick="flip(this)"><div class="animal">❔</div></div>`).join('')}function flip(e){if(lock||e.dataset.done)return;let i=+e.dataset.i;e.firstElementChild.textContent=animals[i][2];if(!pick){pick=e;return}if(e===pick)return;if(e.dataset.i===pick.dataset.i){e.dataset.done=pick.dataset.done=1;light+=3;pick=null;save()}else{lock=true;let p=pick;setTimeout(()=>{p.firstElementChild.textContent=e.firstElementChild.textContent='❔';pick=null;lock=false},550)}}function rescue(){let t=Math.floor(Math.random()*animals.length),arr=[t,...[...Array(animals.length).keys()].filter(i=>i!==t).sort(()=>Math.random()-.5).slice(0,11)].sort(()=>Math.random()-.5);$('rescuehelp').textContent=T(animals[t][0]+'를 찾아 구조하세요! 성공 보상 ✨ +4','Find and rescue the '+animals[t][1]+'! Reward ✨ +4');$('rescuegrid').innerHTML=arr.map(i=>`<div class="card" onclick="res(${i},${t})"><div class="animal">${animals[i][2]}</div><small>${animals[i][lang==='ko'?0:1]}</small></div>`).join('')}function res(i,t){if(i===t){light+=4;save();alert(T('구조 성공! +4','Rescue complete! +4'));rescue()}else alert(T('다른 동물이에요!','Try another animal!'))}function quest(){$('questbox').innerHTML='<p>🧠 '+T('퀴즈 완료','Quizzes completed')+': '+qdone+'/50</p><p>📖 '+T('동물 발견','Animals discovered')+': '+owned.length+'/'+animals.length+'</p><p>✨ Nature Light: '+light+'/100</p>'}render()</script></body></html>
