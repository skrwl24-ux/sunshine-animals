<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sunshine Animals</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;color:#fff;background:#123 url('https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=2200&q=90') center/cover fixed;min-height:100vh}button{font:inherit;cursor:pointer}.shade{min-height:100vh;background:linear-gradient(#001b1760,#05281f55);padding:12px 18px 92px}.top{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}.profile,.res,.icon{background:linear-gradient(#243c37ee,#122a25ee);border:2px solid #b78b3c;border-radius:22px;padding:9px 17px;box-shadow:0 5px 16px #0008;font-weight:800}.profile{margin-right:auto}.res b{color:#ffe35d;font-size:20px}.icon{padding:10px;border-radius:50%}.hero{text-align:center;max-width:1050px;margin:30px auto 0}.logo{display:inline-block;padding:12px 38px 16px;border:8px solid #5b3718;border-radius:35px;background:linear-gradient(#70471f,#39230f);box-shadow:0 12px 30px #0009,0 0 40px #ffd44b55}.logo h1{margin:0;font-size:clamp(42px,7vw,88px);line-height:.8;letter-spacing:-3px;color:#ffc92f;text-shadow:0 5px #8d4a0c}.logo h1 span{display:block;color:#75ce43}.logo p{margin:15px 0 0;background:#f3d08c;color:#4a2b11;padding:5px 18px;border-radius:20px;font-weight:900}.main{display:grid;grid-template-columns:180px 1fr 180px;gap:18px;align-items:center;margin-top:18px}.side{display:grid;gap:8px}.side button{color:#fff;text-align:left;padding:12px;background:linear-gradient(90deg,#4b2c14ee,#2c1b0cee);border:2px solid #9d6b2e;border-radius:12px;font-weight:900;box-shadow:0 4px 12px #0006}.eggs{display:flex;justify-content:center;gap:28px}.eggBox{border:0;background:transparent;color:#fff;font-weight:900;text-shadow:0 2px 5px #000}.egg{width:150px;height:190px;border-radius:50% 50% 46% 46%/58% 58% 42% 42%;margin:auto;position:relative;box-shadow:inset -20px -20px 30px #59412655,inset 15px 10px 22px #fff,0 0 35px #fff8,0 18px 25px #0008;animation:float 2s infinite ease-in-out}.egg:after{content:'';position:absolute;left:28px;top:25px;width:38px;height:60px;border-radius:50%;background:#fff9;filter:blur(3px)}.pearl{background:radial-gradient(circle at 30% 25%,#fff,#fff4c7 20%,#e5eeff 45%,#f6d9ff 70%,#e4b976)}.aurora{background:radial-gradient(circle at 30% 20%,#fff,#ff70c8 20%,#ffdf54 38%,#5ef2c6 55%,#48a9ff 72%,#9d57ff)}@keyframes float{50%{transform:translateY(-9px)}}.eggBox strong{display:block;margin-top:10px;font-size:20px}.actions{display:flex;justify-content:center;gap:12px;margin:18px auto;flex-wrap:wrap}.actions button{min-width:180px;padding:14px 22px;border-radius:22px;border:3px solid #e8bd5d;color:#fff;font-size:20px;font-weight:950;box-shadow:0 7px 18px #0007}.blue{background:linear-gradient(#1680d2,#07529a)}.gold{background:linear-gradient(#ffbf2e,#dc7c09)}.purple{background:linear-gradient(#a85be7,#6330a7)}.info{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:800px;margin:auto}.paper{background:#f3d8a2e8;color:#4a2b12;border:3px solid #7c542a;border-radius:15px;padding:12px;font-weight:750}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);z-index:20;width:min(1000px,100%);display:flex;justify-content:space-around;background:linear-gradient(#4b2e15,#241509);border:3px solid #9b6c31;border-radius:20px 20px 0 0;padding:7px}.nav button{background:none;border:0;color:#fff;padding:8px;font-weight:800}.layer{position:fixed;z-index:30;inset:0;background:#061d18c9;display:flex;align-items:center;justify-content:center;padding:15px}.hide{display:none}.panel{width:min(850px,96vw);max-height:88vh;overflow:auto;background:#fff9e9;color:#3b2b1d;border:6px solid #b98943;border-radius:25px;padding:18px;box-shadow:0 20px 70px #000}.close{float:right;border:0;border-radius:50%;width:40px;height:40px;font-size:22px}.center{text-align:center}.choices,.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;clear:both}.choices button,.card,.answer{padding:12px;border-radius:16px;border:3px solid #b98943;background:#fff;font-weight:800}.hatchEgg{width:170px;height:215px;margin:20px auto}.crack{animation:shake .5s}.crack:before{content:'';position:absolute;left:50%;top:20%;height:65%;width:5px;background:#fff5a1;box-shadow:0 0 25px #fff,-18px 35px 0 -1px #fff5a1,15px 70px 0 -1px #fff5a1}@keyframes shake{20%{transform:rotate(-5deg)}40%{transform:rotate(5deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(4deg)}}.card{min-height:100px}.stars{color:#e6a400}.toast{position:fixed;z-index:99;bottom:80px;left:50%;transform:translateX(-50%);background:#173c32;padding:10px 18px;border-radius:20px}.lang{position:fixed;right:12px;bottom:78px;z-index:22;border:2px solid #d8b15e;background:#163c32;color:#fff;border-radius:20px;padding:8px 15px}@media(max-width:760px){.shade{padding:8px 8px 88px}.profile{width:100%;margin:0}.main{grid-template-columns:1fr}.side{grid-template-columns:repeat(3,1fr);order:2}.side button{font-size:11px;padding:8px}.right{display:none}.logo{padding:10px 20px}.logo h1{font-size:45px}.egg{width:105px;height:135px}.eggs{gap:10px}.actions button{min-width:29%;font-size:14px;padding:10px}.info{grid-template-columns:1fr}.nav button{font-size:10px}.res{padding:7px 10px}.hero{margin-top:16px}}</style></head><body><script src="game-data.js"></script><div class="shade"><div class="top"><div class="profile">🦦 자연을 사랑하는 탐험가　Lv.27</div><div class="res">🌿 자연의 빛 <b id="light">53</b></div><div class="res">💎 별가루 <b id="dust">0</b></div><div class="res">🐾 발견 <b id="count">0/115</b></div></div><main class="hero"><div class="logo"><h1>SUNSHINE<span>ANIMALS</span></h1><p>귀여운 동물을 깨우고, 발견하고, 함께 모험하세요!</p></div><div class="main"><div class="side"><button onclick="openQuiz()">📘 동물 퀴즈<br><small>퀴즈 풀고 빛 획득!</small></button><button onclick="openBook()">🐾 동물도감<br><small>수집 현황</small></button><button onclick="openParty()">🎉 애니멀 파티<br><small>같은 동물 찾기</small></button></div><div><div class="eggs"><button class="eggBox" onclick="hatchMenu(false)"><div class="egg pearl"></div><strong>PEARL ◯</strong>숲의 알</button><button class="eggBox" onclick="hatchMenu(true)"><div class="egg aurora"></div><strong>★ AURORA</strong>빛나는 알</button></div><div class="actions"><button class="blue" onclick="hatchMenu(false)">1회 부화<br><small>✨ 5</small></button><button class="gold" onclick="hatchMenu(false)">5회 부화<br><small>✨ 25</small></button><button class="purple" onclick="hatchMenu(true)">빛나는 알<br><small>희귀 UP</small></button></div></div><div class="side right"><button onclick="openRescue()">🛟 동물 구조대<br><small>동물을 구해주세요!</small></button><button onclick="openQuest()">📜 퀘스트<br><small>일일 미션</small></button><button onclick="openBook()">🏆 디스커버리 북<br><small>115종 수집</small></button></div></div><div class="info"><div class="paper">🎁 <b>매일 접속 보너스</b><br>게임을 즐기며 자연의 빛을 모아보세요!</div><div class="paper">🦉 <b>오늘의 한 줄 상식</b><br>해달은 떠내려가지 않도록 서로 손을 잡고 자기도 해요!</div></div></main></div><nav class="nav"><button onclick="home()">🏠 홈</button><button onclick="hatchMenu(false)">🥚 부화</button><button onclick="openBook()">📖 도감</button><button onclick="openQuiz()">❓ 퀴즈</button><button onclick="openParty()">🎈 파티</button><button onclick="openRescue()">🛟 구조대</button><button onclick="openQuest()">📜 퀘스트</button></nav><button class="lang" onclick="toggleLang()" id="lang">🌐 English</button><div id="layer" class="layer hide"><div class="panel"><button class="close" onclick="home()">✕</button><div id="content"></div></div></div><div id="toast" class="toast hide"></div><script>const A=GAME_DATA.animals,Q=GAME_DATA.quizzes,$=x=>document.getElementById(x);let light=+(localStorage.saLight||53),dust=+(localStorage.saDust||0),owned=JSON.parse(localStorage.saOwned||'{}'),lang=localStorage.saLang||'ko',busy=false,last={u:false,n:1};function save(){localStorage.saLight=light;localStorage.saDust=dust;localStorage.saOwned=JSON.stringify(owned);localStorage.saLang=lang;render()}function render(){$('light').textContent=light;$('dust').textContent=dust;$('count').textContent=Object.keys(owned).length+'/'+A.length;$('lang').textContent=lang==='ko'?'🌐 English':'🌐 한국어'}function home(){$('layer').classList.add('hide');render()}function show(){$('layer').classList.remove('hide')}function toast(t){$('toast').textContent=t;$('toast').classList.remove('hide');setTimeout(()=>$('toast').classList.add('hide'),1400)}function toggleLang(){lang=lang==='ko'?'en':'ko';save();toast(lang==='ko'?'한국어 모드':'English mode')}function nm(i){return A[i][lang==='ko'?0:1]}function rarity(i){return i>=110?4:i>=100?3:i>=82?2:i>=55?1:0}function rn(i){return (lang==='ko'?['일반','희귀','특별','전설','환상']:['Common','Rare','Special','Legendary','Mythic'])[rarity(i)]}function pick(u){let r=Math.random(),t=u?(r<.03?4:r<.11?3:r<.29?2:r<.61?1:0):(r<.01?4:r<.06?3:r<.18?2:r<.45?1:0),s=[0,55,82,100,110][t],e=[55,82,100,110,115][t];return s+Math.floor(Math.random()*(e-s))}function hatchMenu(u){show();$('content').innerHTML='<div class="center"><h2>'+(u?'🌈 AURORA 빛나는 알':'🥚 PEARL 숲의 알')+'</h2><div class="egg '+(u?'aurora':'pearl')+' hatchEgg"></div><h3>부화 횟수를 선택하세요</h3><div class="choices"><button onclick="startHatch('+u+',1)"><b>1회 부화</b><br>✨ '+(u?10:5)+'</button><button onclick="startHatch('+u+',5)"><b>5회 연속 부화</b><br>✨ '+(u?50:25)+'</button></div></div>'}function startHatch(u,n){let cost=(u?10:5)*n;if(light<cost){toast('자연의 빛이 부족해요! 퀴즈·파티·구조대를 해보세요.');return}light-=cost;let got=[];for(let k=0;k<n;k++){let i=pick(u);if(owned[i])dust++;owned[i]=(owned[i]||0)+1;got.push(i)}last={u,n};save();$('content').innerHTML='<div class="center"><h2>✨ 부화 직전!</h2><p>알을 눌러 부화시켜 보세요</p><div id="he" class="egg '+(u?'aurora':'pearl')+' hatchEgg" onclick="crack('+JSON.stringify(got)+')"></div></div>'}function crack(g){if(busy)return;busy=true;$('he').classList.add('crack');setTimeout(()=>{busy=false;results(g)},750)}function results(g){$('content').innerHTML='<div class="center"><h2>✨ 새로운 친구 발견!</h2><div class="grid">'+g.map(i=>'<button class="card" onclick="detail('+i+')"><div style="font-size:45px">'+A[i][2]+'</div><b>'+nm(i)+'</b><br><span class="stars">'+'★'.repeat(rarity(i)+1)+'</span><br><small>'+rn(i)+' · '+owned[i]+'회</small></button>').join('')+'</div><br><button class="gold" style="padding:12px 25px;border-radius:15px" onclick="startHatch('+last.u+','+last.n+')">다시 부화하기</button></div>'}function detail(i){show();$('content').innerHTML='<div class="center"><div style="font-size:100px">'+A[i][2]+'</div><h1>'+nm(i)+'</h1><div class="stars">'+'★'.repeat(rarity(i)+1)+'</div><b>'+rn(i)+'</b><p>발견 횟수 '+(owned[i]||0)+'회</p><p>이 동물의 재미있는 특징을 디스커버리 북에서 수집해 보세요.</p></div>'}function openBook(){show();$('content').innerHTML='<div class="center"><h2>📖 나의 디스커버리 북</h2><p>'+Object.keys(owned).length+' / '+A.length+'</p><div class="grid">'+A.map((a,i)=>'<button class="card" '+(owned[i]?'onclick="detail('+i+')"':'disabled style="opacity:.3"')+'><div style="font-size:38px">'+(owned[i]?a[2]:'❔')+'</div><b>'+(owned[i]?nm(i):'???')+'</b><br><small>'+rn(i)+'</small></button>').join('')+'</div></div>'}function openQuiz(){show();let qi=Math.floor(Math.random()*Q.length),q=Q[qi],opts=[q[2],q[3],q[4]].map((v,i)=>({v,i})).sort(()=>Math.random()-.5);$('content').innerHTML='<div class="center"><h2>📘 동물 퀴즈</h2><h3>'+q[0]+'</h3><div class="choices">'+opts.map(o=>'<button class="answer" onclick="answer('+o.i+')">'+o.v+'</button>').join('')+'</div></div>'}function answer(i){if(i===0){light+=5;save();toast('정답! 자연의 빛 +5 ✨')}else toast('아쉬워요! 다시 도전해보세요');setTimeout(openQuiz,1200)}function openParty(){show();let ids=[...Array(6)].map(()=>Math.floor(Math.random()*A.length)),deck=[...ids,...ids].sort(()=>Math.random()-.5),first=null,lock=false;$('content').innerHTML='<div class="center"><h2>🎉 애니멀 파티</h2><p>같은 동물을 찾아 짝을 맞춰보세요!</p><div class="grid" id="party">'+deck.map(i=>'<button class="card" data-i="'+i+'" onclick="flip(this)">❔</button>').join('')+'</div></div>';window.flip=function(e){if(lock||e.dataset.done||e===first)return;let i=+e.dataset.i;e.innerHTML='<div style="font-size:45px">'+A[i][2]+'</div>'+nm(i);if(!first){first=e;return}if(first.dataset.i===e.dataset.i){first.dataset.done=e.dataset.done=1;first=null;light+=3;save();toast('짝 맞추기 성공! +3 ✨')}else{lock=true;let f=first;setTimeout(()=>{f.innerHTML=e.innerHTML='❔';first=null;lock=false},650)}}}function openRescue(){show();let t=Math.floor(Math.random()*A.length),ids=[t,...[...Array(A.length).keys()].filter(i=>i!==t).sort(()=>Math.random()-.5).slice(0,8)].sort(()=>Math.random()-.5);$('content').innerHTML='<div class="center"><h2>🛟 동물 구조대</h2><h3>'+A[t][0]+'를 찾아주세요!</h3><div class="grid">'+ids.map(i=>'<button class="card" onclick="rescue('+i+','+t+')"><div style="font-size:48px">'+A[i][2]+'</div></button>').join('')+'</div></div>'}function rescue(i,t){if(i===t){light+=4;save();toast('구조 성공! +4 ✨');setTimeout(openRescue,900)}else toast('다른 동물이에요!')}function openQuest(){show();$('content').innerHTML='<div class="center"><h2>📜 오늘의 퀘스트</h2><div class="choices"><div class="card">📖<h3>도감 수집</h3>'+Object.keys(owned).length+'/'+A.length+'</div><div class="card">✨<h3>자연의 빛</h3>'+light+'</div><div class="card">💎<h3>별가루</h3>'+dust+'</div></div><p>퀴즈, 애니멀 파티, 구조대로 자연의 빛을 모아 새로운 동물을 깨워보세요!</p></div>'}render();</script></body></html>
