<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sunshine Animals</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;color:#fff;background:#0c2b23 url('https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=2200&q=90') center/cover fixed;min-height:100vh}button{font:inherit;cursor:pointer}.shade{min-height:100vh;background:linear-gradient(#001b175c,#05281f50);padding:10px 16px 92px}.top{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}.profile,.res{background:linear-gradient(#263e38f5,#122821f5);border:2px solid #b98a3a;border-radius:22px;padding:8px 15px;box-shadow:0 6px 18px #0008;font-weight:850}.profile{margin-right:auto}.res b{color:#ffe36d;font-size:19px}.hero{text-align:center;max-width:1120px;margin:24px auto 0}.logo{display:inline-block;padding:10px 34px 14px;border:7px solid #5b3618;border-radius:32px;background:linear-gradient(#765027,#3b260f);box-shadow:0 12px 30px #0009,0 0 45px #ffd44b44}.logo h1{margin:0;font-size:clamp(40px,6.5vw,82px);line-height:.82;letter-spacing:-3px;color:#ffc52f;text-shadow:0 5px #8d4a0c}.logo h1 span{display:block;color:#72cf47}.logo p{margin:12px 0 0;background:#f4d398;color:#45280e;padding:5px 18px;border-radius:20px;font-weight:900}.main{display:grid;grid-template-columns:170px 1fr 170px;gap:16px;align-items:center;margin-top:16px}.side{display:grid;gap:8px}.side button{color:#fff;text-align:left;padding:12px;background:linear-gradient(90deg,#4b2b13f4,#2a180af4);border:2px solid #a06d2f;border-radius:12px;font-weight:900;box-shadow:0 4px 12px #0006}.eggs{display:flex;justify-content:center;gap:30px}.eggBox{border:0;background:transparent;color:#fff;font-weight:900;text-shadow:0 2px 5px #000}.egg{width:152px;height:192px;border-radius:50% 50% 46% 46%/58% 58% 42% 42%;margin:auto;position:relative;box-shadow:inset -20px -20px 30px #59412655,inset 15px 10px 22px #fff,0 0 38px #fff8,0 18px 25px #0008;animation:float 2s infinite ease-in-out}.egg:after{content:'';position:absolute;left:28px;top:25px;width:38px;height:60px;border-radius:50%;background:#fff9;filter:blur(3px)}.pearl{background:radial-gradient(circle at 30% 25%,#fff,#fff3cf 18%,#dff7ef 39%,#e7e2ff 60%,#f6d6ee 77%,#e4bd7c)}.aurora{background:radial-gradient(circle at 30% 20%,#fff,#ff70c8 20%,#ffe05d 38%,#5ef2c6 55%,#48a9ff 72%,#9d57ff)}@keyframes float{50%{transform:translateY(-9px)}}.eggBox strong{display:block;margin-top:8px;font-size:20px}.info{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:820px;margin:16px auto 0}.paper{background:#f4d9a5ed;color:#4a2b12;border:3px solid #7c542a;border-radius:15px;padding:12px;font-weight:760}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);z-index:20;width:min(1000px,100%);display:flex;justify-content:space-around;background:linear-gradient(#4b2e15,#241509);border:3px solid #9b6c31;border-radius:20px 20px 0 0;padding:7px}.nav button{background:none;border:0;color:#fff;padding:8px;font-weight:800}.layer{position:fixed;z-index:30;inset:0;background:#061d18c9;display:flex;align-items:center;justify-content:center;padding:15px}.hide{display:none}.panel{width:min(980px,97vw);max-height:91vh;overflow:auto;background:#f5e8c8;color:#3b2b1d;border:6px solid #a26d2e;border-radius:24px;padding:18px;box-shadow:0 22px 70px #000}.close{float:right;border:2px solid #8c642e;background:#fff7e4;border-radius:50%;width:40px;height:40px;font-size:21px}.center{text-align:center}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;clear:both}.choices button,.answer{padding:14px;border-radius:16px;border:3px solid #b98943;background:#fffaf0;font-weight:850}.hatchEgg{width:170px;height:215px;margin:20px auto}.crack{animation:shake .5s}.crack:before{content:'';position:absolute;left:50%;top:20%;height:65%;width:5px;background:#fff5a1;box-shadow:0 0 25px #fff,-18px 35px 0 -1px #fff5a1,15px 70px 0 -1px #fff5a1}@keyframes shake{20%{transform:rotate(-5deg)}40%{transform:rotate(5deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(4deg)}}.bookHead{display:flex;align-items:center;justify-content:space-between;gap:12px;clear:both}.filters{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 14px}.filters button{border:2px solid #8f672e;background:#fff8e6;border-radius:999px;padding:8px 13px;font-weight:850}.filters button.active{background:#5b3a19;color:#ffe169}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;clear:both}.card{position:relative;background:#fff;border:3px solid #5aa562;border-radius:16px;padding:7px;text-align:left;overflow:hidden;box-shadow:0 5px 14px #0002}.cardImg,.photoSlot{width:100%;aspect-ratio:1.05/1;object-fit:cover;border-radius:11px;background:linear-gradient(135deg,#dbe9dc,#f7fbef);display:flex;align-items:center;justify-content:center}.cardName{font-weight:900;margin-top:5px}.meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#5f6b59}.rarityBadge{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#17392f;color:#ffd64a;border:2px solid #d7b648;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:900}.qty{font-weight:900;color:#1c3228}.r0{border-color:#56a660}.r1{border-color:#469fd8;box-shadow:0 0 18px #469fd84a}.r2{border-color:#9a58d8;box-shadow:0 0 20px #9a58d855}.r3{border-color:#e8ad26;box-shadow:0 0 24px #e8ad2670}.r4{border-color:#ff62c9;box-shadow:0 0 30px #8e65ff90;background:linear-gradient(135deg,#fff,#fff1fb)}.locked{filter:grayscale(1);opacity:.28}.newTag{position:absolute;right:7px;top:7px;background:#e84932;color:white;padding:3px 7px;border-radius:8px;font-size:10px;font-weight:900}.detailWrap{display:grid;grid-template-columns:minmax(260px,420px) 1fr;gap:18px;clear:both}.detailImg{width:100%;border-radius:18px;border:5px solid #d4b46d;box-shadow:0 10px 25px #0003}.detailText{background:#fff7e7;border:2px solid #d6bb82;border-radius:18px;padding:16px}.detailText h1{margin-top:0}.stars{color:#e4a516;letter-spacing:2px}.again{margin-top:14px;padding:12px 22px;border:0;border-radius:15px;background:#2d6a45;color:#fff;font-weight:900}.toast{position:fixed;z-index:99;bottom:80px;left:50%;transform:translateX(-50%);background:#173c32;padding:10px 18px;border-radius:20px}.lang{position:fixed;right:12px;bottom:78px;z-index:22;border:2px solid #d8b15e;background:#163c32;color:#fff;border-radius:20px;padding:8px 15px}.memory{height:125px;display:flex;align-items:center;justify-content:center;font-size:40px;border-radius:11px;background:linear-gradient(135deg,#e7f7df,#fff1bd)}@media(max-width:760px){.shade{padding:8px 8px 88px}.profile{width:100%;margin:0}.main{grid-template-columns:1fr}.side{grid-template-columns:repeat(3,1fr);order:2}.side button{font-size:11px;padding:8px}.right{display:none}.logo{padding:10px 20px}.logo h1{font-size:45px}.egg{width:108px;height:138px}.eggs{gap:12px}.info{grid-template-columns:1fr}.nav button{font-size:10px}.res{padding:7px 10px}.hero{margin-top:16px}.grid{grid-template-columns:repeat(3,1fr);gap:6px}.card{padding:4px}.cardName{font-size:11px}.detailWrap{grid-template-columns:1fr}.panel{padding:10px}.filters button{font-size:11px;padding:6px 9px}}</style></head><body><script src="game-data.js"></script><div class="shade"><div class="top"><div class="profile">🦦 자연을 사랑하는 탐험가　Lv.27</div><div class="res">🌿 자연의 빛 <b id="light">53</b></div><div class="res">💎 별가루 <b id="dust">0</b></div><div class="res">🐾 발견 <b id="count">0/115</b></div></div><main class="hero"><div class="logo"><h1>SUNSHINE<span>ANIMALS</span></h1><p>귀여운 동물을 깨우고, 발견하고, 함께 모험하세요!</p></div><div class="main"><div class="side"><button onclick="openQuiz()">📘 동물 퀴즈<br><small>퀴즈 풀고 빛 획득!</small></button><button onclick="openBook()">🐾 동물도감<br><small>수집 현황</small></button><button onclick="openParty()">🎉 애니멀 파티<br><small>같은 동물 찾기</small></button></div><div><div class="eggs"><button class="eggBox" onclick="hatchMenu(false)"><div class="egg pearl"></div><strong>PEARL ◯</strong>숲의 알</button><button class="eggBox" onclick="hatchMenu(true)"><div class="egg aurora"></div><strong>★ AURORA</strong>빛나는 알</button></div></div><div class="side right"><button onclick="openRescue()">🛟 동물 구조대<br><small>동물을 구해주세요!</small></button><button onclick="openQuest()">📜 퀘스트<br><small>일일 미션</small></button><button onclick="openBook()">🏆 디스커버리 북<br><small>115종 수집</small></button></div></div><div class="info"><div class="paper">🎁 <b>매일 접속 보너스</b><br>퀴즈·파티·구조대를 즐기며 자연의 빛을 모아보세요!</div><div class="paper">🦉 <b>오늘의 한 줄 상식</b><br>해달은 떠내려가지 않도록 서로 손을 잡고 자기도 해요!</div></div></main></div><nav class="nav"><button onclick="home()">🏠 홈</button><button onclick="hatchMenu(false)">🥚 부화</button><button onclick="openBook()">📖 도감</button><button onclick="openQuiz()">❓ 퀴즈</button><button onclick="openParty()">🎈 파티</button><button onclick="openRescue()">🛟 구조대</button><button onclick="openQuest()">📜 퀘스트</button></nav><button class="lang" onclick="toggleLang()" id="lang">🌐 English</button><div id="layer" class="layer hide"><div class="panel"><button class="close" onclick="home()">✕</button><div id="content"></div></div></div><div id="toast" class="toast hide"></div><script>const A=GAME_DATA.animals,Q=GAME_DATA.quizzes,$=x=>document.getElementById(x);let light=+(localStorage.saLight||53),dust=+(localStorage.saDust||0),owned=JSON.parse(localStorage.saOwned||'{}'),lang=localStorage.saLang||'ko',busy=false,last={u:false,n:1},filter='all',fresh={};const cache=JSON.parse(localStorage.saImgCache||'{}');const fixes={'Orca':'Killer whale','Red Panda':'Red panda','Snow Leopard':'Snow leopard','Sea Otter':'Sea otter','Emperor Penguin':'Emperor penguin','Pufferfish':'Tetraodontidae','Ladybug':'Coccinellidae'};function save(){localStorage.saLight=light;localStorage.saDust=dust;localStorage.saOwned=JSON.stringify(owned);localStorage.saLang=lang;render()}function render(){$('light').textContent=light;$('dust').textContent=dust;$('count').textContent=Object.keys(owned).length+'/'+A.length;$('lang').textContent=lang==='ko'?'🌐 English':'🌐 한국어'}function home(){$('layer').classList.add('hide');render()}function show(){$('layer').classList.remove('hide')}function toast(t){$('toast').textContent=t;$('toast').classList.remove('hide');setTimeout(()=>$('toast').classList.add('hide'),1400)}function toggleLang(){lang=lang==='ko'?'en':'ko';save();toast(lang==='ko'?'한국어 모드':'English mode')}function nm(i){return A[i][lang==='ko'?0:1]}function rarity(i){return i>=110?4:i>=100?3:i>=82?2:i>=55?1:0}function rn(i){return (lang==='ko'?['일반','희귀','특별','전설','환상']:['Common','Rare','Special','Legendary','Mythic'])[rarity(i)]}async function img(i){if(cache[i])return cache[i];let t=fixes[A[i][1]]||A[i][1];try{let u='https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages&pithumbsize=800&titles='+encodeURIComponent(t),j=await fetch(u).then(r=>r.json()),p=Object.values(j.query.pages)[0],s=p.thumbnail&&p.thumbnail.source;if(s){cache[i]=s;localStorage.saImgCache=JSON.stringify(cache);return s}}catch(e){}return ''}function photo(i,cl='cardImg'){return '<div class="photoSlot" data-i="'+i+'" data-cl="'+cl+'">'+A[i][2]+'</div>'}async function hydrate(root=document){for(const s of [...root.querySelectorAll('.photoSlot')]){let i=+s.dataset.i,src=await img(i);if(!s.isConnected)continue;if(src){let im=document.createElement('img');im.className=s.dataset.cl;im.src=src;im.alt=A[i][1];im.loading='lazy';s.replaceWith(im)}else{s.textContent=A[i][2]}}}function pick(u){let r=Math.random(),t=u?(r<.03?4:r<.11?3:r<.29?2:r<.61?1:0):(r<.01?4:r<.06?3:r<.18?2:r<.45?1:0),s=[0,55,82,100,110][t],e=[55,82,100,110,115][t];return s+Math.floor(Math.random()*(e-s))}function hatchMenu(u){show();$('content').innerHTML='<div class="center"><h2>'+(u?'🌈 AURORA 빛나는 알':'🥚 PEARL 숲의 알')+'</h2><div class="egg '+(u?'aurora':'pearl')+' hatchEgg"></div><h3>부화 횟수를 선택하세요</h3><div class="choices"><button onclick="startHatch('+u+',1)"><b>1회 부화</b><br>✨ '+(u?10:5)+'</button><button onclick="startHatch('+u+',5)"><b>5회 연속 부화</b><br>✨ '+(u?50:25)+'</button></div></div>'}function startHatch(u,n){let cost=(u?10:5)*n;if(light<cost){toast('자연의 빛이 부족해요! 퀴즈·파티·구조대를 해보세요.');return}light-=cost;let got=[];fresh={};for(let k=0;k<n;k++){let i=pick(u);if(owned[i])dust++;else fresh[i]=1;owned[i]=(owned[i]||0)+1;got.push(i)}last={u,n};save();$('content').innerHTML='<div class="center"><h2>✨ 부화 직전!</h2><p>알을 눌러 부화시켜 보세요</p><div id="he" class="egg '+(u?'aurora':'pearl')+' hatchEgg" onclick="crack('+JSON.stringify(got)+')"></div></div>'}function crack(g){if(busy)return;busy=true;$('he').classList.add('crack');setTimeout(()=>{busy=false;results(g)},750)}function cardHtml(i){return '<button class="card r'+rarity(i)+'" onclick="detail('+i+')">'+(fresh[i]?'<span class="newTag">NEW</span>':'')+'<span class="rarityBadge">★ '+rn(i)+'</span>'+photo(i)+'<div class="cardName">'+nm(i)+'</div><div class="meta"><span>동물 카드</span><span class="qty">x'+(owned[i]||0)+'</span></div></button>'}function results(g){$('content').innerHTML='<div class="center"><h2>✨ 새로운 친구 발견!</h2><div class="grid">'+g.map(cardHtml).join('')+'</div><button class="again" onclick="startHatch('+last.u+','+last.n+')">다시 부화하기</button></div>';hydrate($('content'))}function detail(i){show();$('content').innerHTML='<div class="bookHead"><div><h2 style="margin:0">'+nm(i)+'</h2><div class="stars">'+'★'.repeat(rarity(i)+1)+' '+rn(i)+'</div></div></div><div class="detailWrap"><div>'+photo(i,'detailImg')+'</div><div class="detailText"><h1>'+nm(i)+'</h1><p><b>등급</b> '+rn(i)+'</p><p><b>발견 횟수</b> '+(owned[i]||0)+'회</p><p><b>특징</b> 이 동물의 개성과 생태 이야기를 도감에서 모아보세요.</p><p>💡 <b>재미있는 사실</b><br>동물마다 살아가는 환경에 맞춘 특별한 특징이 있어요.</p></div></div>';hydrate($('content'))}function openBook(){show();filter='all';renderBook()}function setFilter(f){filter=f;renderBook()}function renderBook(){let list=A.map((a,i)=>i).filter(i=>filter==='all'||rarity(i)==filter);$('content').innerHTML='<div class="bookHead"><div><h2 style="margin:0">📖 나의 발견 도감</h2><small>'+Object.keys(owned).length+' / '+A.length+'</small></div></div><div class="filters"><button class="'+(filter==='all'?'active':'')+'" onclick="setFilter(\'all\')">전체</button>'+[0,1,2,3,4].map(r=>'<button class="'+(filter===r?'active':'')+'" onclick="setFilter('+r+')">'+(lang==='ko'?['일반','희귀','특별','전설','환상'][r]:['Common','Rare','Special','Legendary','Mythic'][r])+'</button>').join('')+'</div><div class="grid">'+list.map(i=>owned[i]?cardHtml(i):'<div class="card r'+rarity(i)+' locked"><div class="photoSlot">🔒</div><div class="cardName">???</div><div class="meta"><span>'+rn(i)+'</span><span>미발견</span></div></div>').join('')+'</div>';hydrate($('content'))}function openQuiz(){show();let qi=Math.floor(Math.random()*Q.length),q=Q[qi],ko=lang==='ko',opts=(ko?[q[2],q[3],q[4]]:[q[5],q[6],q[7]]).map((v,i)=>({v,i})).sort(()=>Math.random()-.5);$('content').innerHTML='<div class="center"><h2>📘 '+(ko?'동물 퀴즈':'Animal Quiz')+'</h2><h3>'+(ko?q[0]:q[1])+'</h3><div class="choices">'+opts.map(o=>'<button class="answer" onclick="answer('+o.i+')">'+o.v+'</button>').join('')+'</div></div>'}function answer(i){if(i===0){light+=5;save();toast(lang==='ko'?'정답! 자연의 빛 +5 ✨':'Correct! Nature Light +5 ✨')}else toast(lang==='ko'?'아쉬워요!':'Nice try!');setTimeout(openQuiz,1200)}function openParty(){show();let ids=[...Array(6)].map(()=>Math.floor(Math.random()*A.length)),deck=[...ids,...ids].sort(()=>Math.random()-.5),first=null,lock=false;$('content').innerHTML='<div class="center"><h2>🎉 애니멀 파티</h2><p>같은 동물을 찾아 짝을 맞춰보세요!</p><div class="grid">'+deck.map(i=>'<button class="card" data-i="'+i+'" onclick="flip(this)"><div class="memory">❔</div></button>').join('')+'</div></div>';window.flip=async function(e){if(lock||e.dataset.done||e===first)return;let i=+e.dataset.i;e.innerHTML=photo(i);await hydrate(e);if(!first){first=e;return}if(first.dataset.i===e.dataset.i){first.dataset.done=e.dataset.done=1;first=null;light+=3;save();toast('짝 맞추기 성공! +3 ✨')}else{lock=true;let f=first;setTimeout(()=>{f.innerHTML=e.innerHTML='<div class="memory">❔</div>';first=null;lock=false},650)}}}function openRescue(){show();let t=Math.floor(Math.random()*A.length),ids=[t,...[...Array(A.length).keys()].filter(i=>i!==t).sort(()=>Math.random()-.5).slice(0,8)].sort(()=>Math.random()-.5);$('content').innerHTML='<div class="center"><h2>🛟 동물 구조대</h2><h3>'+nm(t)+'를 찾아주세요!</h3><div class="grid">'+ids.map(i=>'<button class="card" onclick="rescue('+i+','+t+')">'+photo(i)+'</button>').join('')+'</div></div>';hydrate($('content'))}function rescue(i,t){if(i===t){light+=4;save();toast('구조 성공! +4 ✨');setTimeout(openRescue,900)}else toast('다른 동물이에요!')}function openQuest(){show();$('content').innerHTML='<div class="center"><h2>📜 오늘의 퀘스트</h2><div class="choices"><div class="card">📖<h3>도감 수집</h3>'+Object.keys(owned).length+'/'+A.length+'</div><div class="card">✨<h3>자연의 빛</h3>'+light+'</div><div class="card">💎<h3>별가루</h3>'+dust+'</div></div><p>퀴즈, 애니멀 파티, 구조대로 자연의 빛을 모아 새로운 동물을 깨워보세요!</p></div>'}render();</script></body></html>
