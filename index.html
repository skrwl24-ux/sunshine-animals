<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sunshine Animals</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(160deg,#fff8d9,#eafff4);color:#18382f}header{padding:14px;background:#123d34;color:white;display:flex;justify-content:space-between;position:sticky;top:0}.light{background:#ffe77a;color:#594800;padding:7px 12px;border-radius:99px;font-weight:900}main{max-width:900px;margin:auto;padding:14px}.hero{text-align:center;padding:28px;background:linear-gradient(145deg,#1b5b4c,#2b8068);color:white;border-radius:28px}.sun{font-size:72px}.nav,.eggs{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}button{border:0;border-radius:16px;padding:14px;background:white;font-weight:800}.panel{margin-top:12px;padding:18px;background:#ffffffd9;border-radius:25px}.egg{font-size:50px}.hide{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:9px}.card{background:white;border-radius:17px;padding:12px;text-align:center}.animal{font-size:45px}@media(max-width:600px){.nav,.eggs{grid-template-columns:1fr 1fr}}</style></head><body><header><b>☀️ SUNSHINE ANIMALS</b><span class="light">✨ <span id="light">40</span></span></header><main><div class="hero"><div class="sun">☀️</div><h1>선샤인 애니멀즈 REMASTER</h1><p>빛을 모으고 알을 깨워 동물을 발견하세요!</p></div><div class="nav"><button onclick="go('eggs')">🥚 알 탐험</button><button onclick="go('quiz')">🧠 퀴즈</button><button onclick="go('book')">📖 도감</button></div><section id="eggs" class="panel"><h2>✨ 자연의 빛이 새로운 생명을 깨워요</h2><div class="eggs"><button onclick="hatch(5)"><div class="egg">🥚</div>숲의 알<br>✨5</button><button onclick="hatch(10)"><div class="egg">🌈</div>빛나는 알<br>✨10</button></div></section><section id="quiz" class="panel hide"><h2>🧠 동물 퀴즈</h2><p>지구에서 가장 큰 동물은?</p><button onclick="reward()">대왕고래</button> <button>코끼리</button></section><section id="book" class="panel hide"><h2>📖 My Discovery Book</h2><div id="grid" class="grid"></div></section></main><script>let light=+(localStorage.saLight||40),owned=JSON.parse(localStorage.saOwned||'[]');const animals=[['범고래','🐋'],['대왕고래','🐋'],['일각고래','🐋'],['돌고래','🐬'],['고래상어','🦈'],['복어','🐡'],['문어','🐙'],['바다거북','🐢'],['황제펭귄','🐧'],['북극곰','🐻‍❄️'],['호랑이','🐯'],['사자','🦁'],['치타','🐆'],['늑대','🐺'],['여우','🦊'],['판다','🐼'],['코끼리','🐘'],['기린','🦒'],['얼룩말','🦓'],['코뿔소','🦏'],['하마','🦛'],['고릴라','🦍'],['오랑우탄','🦧'],['캥거루','🦘'],['코알라','🐨'],['나무늘보','🦥'],['비버','🦫'],['수달','🦦'],['고슴도치','🦔'],['라쿤','🦝']];function save(){localStorage.saLight=light;localStorage.saOwned=JSON.stringify(owned);render()}function render(){document.getElementById('light').textContent=light;document.getElementById('grid').innerHTML=animals.map((a,i)=>`<div class="card"><div class="animal">${owned.includes(i)?a[1]:'❔'}</div><b>${owned.includes(i)?a[0]:'???'}</b></div>`).join('')}function go(id){['eggs','quiz','book'].forEach(x=>document.getElementById(x).classList.toggle('hide',x!==id));render()}function hatch(c){if(light<c){alert('자연의 빛이 부족해요! 퀴즈로 모아보세요.');go('quiz');return}light-=c;let i=Math.floor(Math.random()*animals.length);if(!owned.includes(i))owned.push(i);save();alert('부화 성공! '+animals[i][1]+' '+animals[i][0])}function reward(){light+=5;save();alert('정답! 자연의 빛 +5')}render()</script></body></html>
