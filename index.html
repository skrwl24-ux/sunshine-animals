<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sunshine Animals</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,sans-serif;color:#183d34}body{background:linear-gradient(#17483a55,#0c312b66),url('https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=2200&q=85') center/cover fixed}button{font:inherit;cursor:pointer}.top{position:fixed;z-index:20;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none}.brand,.hud>*{pointer-events:auto;background:#fffdf2ee;border:1px solid #fff;border-radius:16px;box-shadow:0 7px 24px #0003}.brand{padding:9px 13px;font-weight:950}.brand small{display:block;font-size:8px;letter-spacing:1.5px}.hud{display:flex;gap:6px}.hud>*{padding:9px 12px}.lang{background:#17473f;color:#fff;border:0}.world{min-height:100vh;padding:76px 12px 78px;display:flex;align-items:center;justify-content:center}.scene{width:min(900px,96vw);text-align:center}.headline{font-size:clamp(28px,4.4vw,54px);line-height:1.05;margin:5px 0 8px;color:#f9fff6;text-shadow:0 3px 18px #102d28,0 2px 2px #102d28}.sub{display:inline-block;padding:7px 12px;border-radius:999px;background:#fffde6e8;font-weight:800;font-size:13px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px auto;max-width:700px}.quick button,.eggPick{border:1px solid #fff;background:#fffdf1e9;border-radius:18px;padding:12px;box-shadow:0 9px 26px #0003;font-weight:850}.eggs{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:520px;margin:auto}.eggPick{position:relative;overflow:hidden}.eggPick.aur{background:linear-gradient(145deg,#fff9f0ed,#f5eafff2);border:2px solid #c379ef}.egg{width:112px;height:142px;margin:5px auto 9px;border-radius:50% 50% 46% 46%/58% 58% 42% 42%;position:relative;box-shadow:inset -15px -16px 24px #5c46334a,inset 14px 10px 20px #fff,0 13px 22px #0004}.egg:after{content:'';position:absolute;left:23px;top:19px;width:27px;height:43px;border-radius:50%;background:#fff9;filter:blur(2px)}.pearl{background:radial-gradient(circle at 32% 25%,#fff,#e8fff5 20%,#e6e9ff 40%,#f7dfef 60%,#d6c5a6 88%)}.aurora{background:radial-gradient(circle at 30% 22%,#fff,#7ff2d7 18%,#78b5ff 40%,#bd70ff 62%,#ff79c8 82%,#ffd37a)}.nav{position:fixed;z-index:25;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:2px;padding:5px;background:#f8fff8ef;border:1px solid #fff;border-radius:17px;box-shadow:0 8px 28px #0003;max-width:96vw;overflow:auto}.nav button{border:0;background:transparent;padding:9px 11px;white-space:nowrap;font-size:12px;font-weight:850;border-radius:12px}.nav button:hover{background:#e6f6ec}.layer{position:fixed;z-index:15;inset:0;padding:70px 12px 72px;background:#12382d70;backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center}.hide{display:none!important}.panel{width:min(760px,94vw);max-height:78vh;overflow:auto;background:#fffef6f5;border:5px solid #fff;border-radius:25px;padding:16px;box-shadow:0 25px 70px #0007}.close{float:left;width:38px;height:38px;border-radius:50%;border:1px solid #c9dfd5;background:#fff;font-weight:900}.center{text-align:center}.hatchMenu{clear:both;text-align:center}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.choice{border:2px solid #d7e7de;background:#fff;border-radius:19px;padding:15px;font-weight:850}.choice.five{border-color:#bd76ec;background:#faf1ff}.choice strong{display:block;font-size:28px}.hatchStage{clear:both;text-align:center;padding:8px}.hatchStage .egg{width:145px;height:184px;margin:20px auto;animation:breathe 1.7s infinite;cursor:pointer}.hatchStage.crack .egg{animation:crack .45s ease}.hatchStage.crack .egg:before{content:'';position:absolute;z-index:2;left:55%;top:25%;width:4px;height:58%;background:linear-gradient(#fff6a6,#f0b832);box-shadow:-12px 18px 0 -1px #ffd85a,11px 34px 0 -1px #ffd85a;transform:rotate(9deg);filter:drop-shadow(0 0 8px #ffe25d)}@keyframes breathe{50%{transform:translateY(-7px) scale(1.02)}}@keyframes crack{20%{transform:rotate(-4deg)}40%{transform:rotate(4deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(3deg)}}.flash{animation:flash .7s}@keyframes flash{50%{box-shadow:inset 0 0 180px #fff,0 0 100px #ffe967}}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:9px;clear:both}.card{position:relative;border:3px solid #5aaa6b;border-radius:17px;background:#fff;padding:6px;overflow:hidden;text-align:center;box-shadow:0 5px 15px #0002}.card img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:11px;background:#e7eee9}.card b{display:block;font-size:13px}.card small{font-size:10px}.r0{border-color:#58aa67}.r1{border-color:#47a8e9;box-shadow:0 0 16px #47a8e955}.r2{border-color:#a657df;box-shadow:0 0 18px #a657df66}.r3{border-color:#efb728;box-shadow:0 0 22px #efb72888}.r4{border-color:#ff67c9;box-shadow:0 0 28px #9b69ff99;background:linear-gradient(135deg,#fff,#fff0fc)}.locked{filter:grayscale(1);opacity:.28}.resultOne{max-width:390px;margin:auto;border-width:5px}.resultOne img{width:100%;max-height:42vh;object-fit:cover;border-radius:14px}.resultOne h2{margin:7px}.fiveGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.fiveGrid .card{padding:4px}.again{position:sticky;bottom:0;margin-top:10px;width:100%;border:0;border-radius:15px;padding:13px;background:#185b48;color:#fff;font-weight:900}.answers{display:grid;gap:8px;margin-top:12px}.answers button{border:1px solid #d2e6db;background:#fff;border-radius:14px;padding:12px;font-weight:800}.answerNote{margin-top:10px;padding:10px;background:#eef9f1;border-radius:13px;font-weight:750}.memoryBack{height:115px;display:flex;align-items:center;justify-content:center;font-size:38px;background:linear-gradient(135deg,#e6fff0,#fff5bd);border-radius:11px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{padding:13px;border-radius:15px;background:#f1faf4;text-align:center}.detail{text-align:left}.detail img{width:100%;max-height:330px;object-fit:cover;border-radius:15px}.stars{letter-spacing:2px;color:#e9a900}.rarity{font-size:11px;font-weight:900}.toast{position:fixed;z-index:80;left:50%;bottom:82px;transform:translateX(-50%);background:#173e35;color:#fff;padding:10px 15px;border-radius:999px;box-shadow:0 7px 25px #0005}.loading{aspect-ratio:1;background:#edf4ef;display:flex;align-items:center;justify-content:center;border-radius:11px;font-size:11px}@media(max-width:650px){.world{padding-top:95px}.headline{font-size:32px}.quick{grid-template-columns:1fr 1fr 1fr}.quick button{font-size:11px;padding:9px}.egg{width:88px;height:112px}.eggPick{padding:9px}.choices{grid-template-columns:1fr 1fr}.panel{max-height:80vh;padding:12px}.fiveGrid{grid-template-columns:repeat(5,1fr);gap:3px}.fiveGrid b,.fiveGrid small{font-size:8px}.nav button{padding:8px;font-size:11px}}</style></head><body><script src="game-data.js"></script><header class="top"><div class="brand">☀️ Sunshine Animals<small>선샤인 애니멀즈</small></div><div class="hud"><div>✨ <span id="light">40</span></div><button class="lang" onclick="toggleLang()" id="langBtn">English</button></div></header><main class="world"><section class="scene"><div class="sub" id="sub"></div><h1 class="headline" id="headline"></h1><div class="quick"><button onclick="openPanel('quiz')">🧠<br>동물 퀴즈</button><button onclick="openPanel('party')">🎉<br>애니멀 파티</button><button onclick="openPanel('rescue')">🛟<br>구조대</button></div><div class="eggs"><button class="eggPick" onclick="hatchMenu(false)"><b>PEARL</b><div class="egg pearl"></div><strong>숲의 알</strong><small>✨ 5</small></button><button class="eggPick aur" onclick="hatchMenu(true)"><b>AURORA</b><div class="egg aurora"></div><strong>빛나는 알</strong><small>✨ 10 · 희귀 UP</small></button></div></section></main><nav class="nav"><button onclick="home()">🥚 알 부화</button><button onclick="openPanel('quiz')">🧠 퀴즈</button><button onclick="openPanel('party')">🎉 파티</button><button onclick="openPanel('rescue')">🛟 구조대</button><button onclick="openPanel('quest')">🎯 퀘스트</button><button onclick="openPanel('book')">📖 도감 <span id="count"></span></button></nav><div id="layer" class="layer hide"><section class="panel"><button class="close" onclick="home()">←</button><div id="content"></div></section></div><div id="toast" class="toast hide"></div><script>const A=GAME_DATA.animals,Q=GAME_DATA.quizzes,$=id=>document.getElementById(id);let lang=localStorage.saLang||'ko',light=+(localStorage.saLight||40),owned=JSON.parse(localStorage.saOwned||'{}'),qOrder=JSON.parse(localStorage.saQOrder||'null'),qPos=+(localStorage.saQPos||0),pair=null,busy=false,lastHatch=null;const tr=(k,e)=>lang==='ko'?k:e;function rarity(i){return i>=110?4:i>=100?3:i>=82?2:i>=55?1:0}function rname(i){return tr(['일반','희귀','특별','영웅','환상'][rarity(i)],['Common','Rare','Special','Hero','Mythic'][rarity(i)])}function stars(i){return '★'.repeat(rarity(i)+1)}const fix={'Orca':'Killer whale','Pufferfish':'Tetraodontidae','Red Panda':'Red panda','Snow Leopard':'Snow leopard','Sea Otter':'Sea otter','Emperor Penguin':'Emperor penguin'};const cache=JSON.parse(localStorage.saImgs||'{}');async function image(i){if(cache[i])return cache[i];let title=fix[A[i][1]]||A[i][1];try{let u='https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages&pithumbsize=700&titles='+encodeURIComponent(title),j=await fetch(u).then(r=>r.json()),p=Object.values(j.query.pages)[0],s=p.thumbnail&&p.thumbnail.source;if(s){cache[i]=s;localStorage.saImgs=JSON.stringify(cache);return s}}catch(e){}return ''}function slot(i,cls=''){return '<div class="loading photo" data-i="'+i+'" data-cls="'+cls+'">'+tr('사진 준비중','Loading')+'</div>'}async function hydrate(root=document){for(const s of [...root.querySelectorAll('.photo')]){let i=+s.dataset.i,src=await image(i);if(!s.isConnected)continue;if(src){let im=document.createElement('img');im.src=src;im.alt=A[i][1];im.loading='lazy';if(s.dataset.cls)im.className=s.dataset.cls;s.replaceWith(im)}else{s.textContent=A[i][2]}}}function save(){localStorage.saLang=lang;localStorage.saLight=light;localStorage.saOwned=JSON.stringify(owned);localStorage.saQOrder=JSON.stringify(qOrder);localStorage.saQPos=qPos;render()}function render(){$('light').textContent=light;$('count').textContent=Object.keys(owned).length+'/115';$('langBtn').textContent=lang==='ko'?'English':'한국어';$('sub').textContent='✨ '+tr('자연의 빛으로 새로운 친구를 만나보세요','Meet new friends with Nature Light');$('headline').innerHTML=tr('화려한 동물들을<br>찾아보자!','Discover amazing<br>animal friends!')}function toggleLang(){lang=lang==='ko'?'en':'ko';save();home()}function home(){$('layer').classList.add('hide');render()}function show(){ $('layer').classList.remove('hide')}function toast(t){$('toast').textContent=t;$('toast').classList.remove('hide');setTimeout(()=>$('toast').classList.add('hide'),1600)}function egg(u,cls=''){return '<div class="egg '+(u?'aurora':'pearl')+' '+cls+'"></div>'}function hatchMenu(u){show();let c=u?10:5;$('content').innerHTML='<div class="hatchMenu">'+egg(u)+'<h2>'+tr(u?'빛나는 알':'숲의 알',u?'Shining Egg':'Forest Egg')+'</h2><p>'+tr('부화 방법을 선택하세요','Choose hatch type')+'</p><div class="choices"><button class="choice" onclick="startHatch('+u+',1)"><strong>1×</strong>'+tr('1회 부화','Single hatch')+' · ✨'+c+'</button><button class="choice five" onclick="startHatch('+u+',5)"><strong>5×</strong>'+tr('5회 연속 부화','5 hatches')+' · ✨'+c*5+'</button></div><p><small>'+tr('일반 55% · 희귀 27% · 특별 12% · 영웅 5% · 환상 1%','Common 55% · Rare 27% · Special 12% · Hero 5% · Mythic 1%')+'</small></p></div>'}function pick(u){let r=Math.random(),t;if(u){t=r<.03?4:r<.11?3:r<.29?2:r<.61?1:0}else t=r<.01?4:r<.06?3:r<.18?2:r<.45?1:0;let s=[0,55,82,100,110][t],e=[55,82,100,110,115][t];return s+Math.floor(Math.random()*(e-s))}function startHatch(u,n){let c=(u?10:5)*n;if(light<c){toast(tr('자연의 빛이 부족해요','Not enough Nature Light'));return}light-=c;let got=[];for(let x=0;x<n;x++){let i=pick(u);got.push(i);owned[i]=(owned[i]||0)+1}lastHatch={u,n};save();$('content').innerHTML='<div id="hs" class="hatchStage"><h3>'+tr('알을 눌러 부화시켜 보세요','Tap the egg to hatch')+'</h3>'+egg(u)+'</div>';document.querySelector('#hs .egg').onclick=()=>crack(got)}function crack(got){let hs=$('hs');if(busy)return;busy=true;hs.classList.add('crack','flash');setTimeout(()=>{busy=false;showResults(got)},700)}function showResults(g){if(g.length===1){let i=g[0];$('content').innerHTML='<div class="center"><p>✨ '+tr('동물 카드 발견!','Animal card discovered!')+'</p><button class="card resultOne r'+rarity(i)+'" onclick="detail('+i+')">'+slot(i)+'<h2>'+A[i][lang==='ko'?0:1]+'</h2><div class="stars">'+stars(i)+'</div><b>'+rname(i)+'</b><small>'+tr(' · 발견 '+owned[i]+'회',' · Found '+owned[i]+'x')+'</small></button><button class="again" onclick="startHatch('+lastHatch.u+','+lastHatch.n+')">🥚 '+tr('다시 뽑기','Hatch again')+'</button></div>'}else{$('content').innerHTML='<div class="center"><h2>✨ '+tr('5회 연속 부화 결과','5-Hatch Results')+'</h2><div class="fiveGrid">'+g.map(i=>'<button class="card r'+rarity(i)+'" onclick="detail('+i+')">'+slot(i)+'<b>'+A[i][lang==='ko'?0:1]+'</b><small>'+stars(i)+'</small></button>').join('')+'</div><button class="again" onclick="startHatch('+lastHatch.u+',5)">🥚 '+tr('5회 다시 뽑기','Hatch 5 again')+'</button></div>'}hydrate($('content'))}function detail(i){show();$('content').innerHTML='<div class="detail"><button class="close" onclick="openPanel(\'book\')">←</button>'+slot(i)+'<h2>'+A[i][lang==='ko'?0:1]+'</h2><div class="stars">'+stars(i)+' <span class="rarity">'+rname(i)+'</span></div><p>'+tr('발견 횟수: ','Found: ')+(owned[i]||0)+'</p><p>'+tr('이 동물의 특징과 재미있는 생태 이야기를 도감에서 모아보세요.','Collect this animal and discover its fascinating story.')+'</p></div>';hydrate($('content'))}function openPanel(t){show();({quiz,party,rescue,quest,book}[t]||book)()}function shuffled(n){return [...Array(n).keys()].sort(()=>Math.random()-.5)}function quiz(){if(!qOrder||qOrder.length!==Q.length){qOrder=shuffled(Q.length);qPos=0;save()}let qi=qOrder[qPos%Q.length],q=Q[qi],opts=(lang==='ko'?[q[2],q[3],q[4]]:[q[5],q[6],q[7]]).map((v,i)=>({v,i})).sort(()=>Math.random()-.5);$('content').innerHTML='<div class="center"><h2>🧠 '+tr('동물 퀴즈','Animal Quiz')+'</h2><small>'+(qPos%Q.length+1)+' / '+Q.length+'</small><h3>'+(lang==='ko'?q[0]:q[1])+'</h3><div class="answers">'+opts.map(o=>'<button onclick="answer('+o.i+',this)">'+o.v+'</button>').join('')+'</div><div id="note"></div></div>'}function answer(i,b){if(busy)return;busy=true;let ok=i===0;if(ok){light+=5;save()}document.querySelectorAll('.answers button').forEach(x=>x.disabled=true);$('note').innerHTML='<div class="answerNote">'+(ok?'✅ '+tr('정답! 자연의 빛 +5','Correct! Nature Light +5'):'❌ '+tr('아쉬워요. 정답은 첫 번째 정답 항목이에요.','Nice try!'))+'<br><small>'+tr('동물마다 환경에 맞춘 놀라운 특징이 있어요.','Animals have amazing adaptations to their environments.')+'</small></div>';setTimeout(()=>{qPos++;if(qPos>=Q.length){qOrder=shuffled(Q.length);qPos=0}save();busy=false;quiz()},2000)}function party(){pair=null;busy=false;let ids=[...Array(6)].map(()=>Math.floor(Math.random()*A.length)),deck=[...ids,...ids].sort(()=>Math.random()-.5);$('content').innerHTML='<div class="center"><h2>🎉 '+tr('애니멀 파티','Animal Party')+'</h2><p>'+tr('같은 동물 두 장을 찾아보세요','Find matching animal pairs')+'</p><div class="grid">'+deck.map(i=>'<button class="card" data-i="'+i+'" onclick="flip(this)"><div class="memoryBack">❔</div></button>').join('')+'</div></div>'}async function flip(e){if(busy||e.dataset.done||e===pair)return;let i=+e.dataset.i;e.innerHTML=slot(i);await hydrate(e);if(!pair){pair=e;return}if(pair.dataset.i===e.dataset.i){pair.dataset.done=e.dataset.done='1';pair=null;light+=3;save();toast(tr('짝 맞추기 성공! +3','Match! +3'))}else{busy=true;let p=pair;setTimeout(()=>{p.innerHTML=e.innerHTML='<div class="memoryBack">❔</div>';pair=null;busy=false},650)}}function rescue(){let t=Math.floor(Math.random()*A.length),others=shuffled(A.length).filter(i=>i!==t).slice(0,11),ids=[t,...others].sort(()=>Math.random()-.5);$('content').innerHTML='<div class="center"><h2>🛟 '+tr('애니멀 구조대','Animal Rescue')+'</h2><h3>'+tr(A[t][0]+'를 찾아주세요!', 'Find the '+A[t][1]+'!')+'</h3><div class="grid">'+ids.map(i=>'<button class="card" onclick="rescuePick('+i+','+t+')">'+slot(i)+'</button>').join('')+'</div></div>';hydrate($('content'))}function rescuePick(i,t){if(i===t){light+=4;save();toast(tr('구조 성공! +4','Rescued! +4'));setTimeout(rescue,800)}else toast(tr('다른 동물이에요','Try another animal'))}function quest(){$('content').innerHTML='<div class="center"><h2>🎯 '+tr('특별 퀘스트','Special Quests')+'</h2><div class="stats"><div class="stat"><b>📖</b><br>'+Object.keys(owned).length+'/115<br><small>'+tr('도감','Collection')+'</small></div><div class="stat"><b>✨</b><br>'+light+'<br><small>'+tr('자연의 빛','Nature Light')+'</small></div><div class="stat"><b>🧠</b><br>'+qPos+'/'+Q.length+'<br><small>'+tr('퀴즈','Quiz')+'</small></div></div></div>'}function book(){$('content').innerHTML='<div class="center"><h2>📖 '+tr('나의 디스커버리 북','My Discovery Book')+'</h2><p>'+Object.keys(owned).length+' / '+A.length+'</p><div class="grid">'+A.map((a,i)=>'<button class="card r'+rarity(i)+' '+(owned[i]?'':'locked')+'" '+(owned[i]?'onclick="detail('+i+')"':'')+'>'+slot(i)+'<b>'+(owned[i]?a[lang==='ko'?0:1]:'???')+'</b><small>'+stars(i)+'</small></button>').join('')+'</div></div>';hydrate($('content'))}render();</script></body></html>
