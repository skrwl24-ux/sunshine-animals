<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sunshine Animals</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(160deg,#fff8d9,#eafff4);color:#18382f}header{padding:12px;background:#123d34;color:#fff;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:9}.hud{display:flex;gap:6px;align-items:center}.pill,button{border:0;border-radius:16px;padding:11px;font-weight:800}.pill{background:#ffe77a;color:#594800}.lang{background:#ffffff20;color:#fff}main{max-width:900px;margin:auto;padding:12px 12px 80px}.hero{text-align:center;padding:25px;background:linear-gradient(145deg,#1b5b4c,#2b8068);color:#fff;border-radius:28px;box-shadow:0 15px 45px #164a3620}.sun{font-size:66px}.nav{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin:10px 0}.nav button,.panel,button{background:#ffffffdd}.panel{padding:17px;border-radius:24px;margin-top:10px;box-shadow:0 10px 30px #174d3510}.hide{display:none}.eggs,.earn{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.earn{grid-template-columns:repeat(3,1fr);margin-bottom:12px}.egg{font-size:62px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:9px}.card{background:#fff;border:2px solid #e8eee9;border-radius:18px;padding:10px;text-align:center}.animal{font-size:43px}.locked{opacity:.35;filter:grayscale(1)}.answers{display:grid;gap:8px}.answers button{text-align:left}.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.box{background:#fff;border-radius:26px;padding:22px;max-width:430px;width:100%;text-align:center}.big{font-size:80px}.choices{display:grid;gap:8px}@media(max-width:650px){.nav{grid-template-columns:repeat(3,1fr)}.eggs,.earn{grid-template-columns:1fr}}</style></head><body><header><b>☀️ SUNSHINE ANIMALS</b><div class="hud"><span class="pill">✨ <span id="light">40</span></span><button class="lang" onclick="toggleLang()" id="lang">English</button></div></header><main><div class="hero"><div class="sun">☀️</div><h1 id="title">선샤인 애니멀즈</h1><p id="sub">빛을 모으고 알을 깨워 동물을 발견하세요!</p><b id="count"></b></div><div class="nav"><button onclick="go('eggs')">🥚 알</button><button onclick="go('quiz')">🧠 퀴즈</button><button onclick="go('party')">🎉 Party</button><button onclick="go('rescue')">🛟 구조대</button><button onclick="go('quest')">🎯 퀘스트</button><button onclick="go('book')">📖 도감</button></div><section id="eggs" class="panel"><h2>✨ Nature Light</h2><p id="egghelp">자연의 빛이 부족하면 무료 활동으로 모을 수 있어요.</p><div class="earn"><button onclick="go('quiz')">🧠 Quiz +5</button><button onclick="go('party')">🎉 Party +3</button><button onclick="go('rescue')">🛟 Rescue +4</button></div><div class="eggs"><button onclick="hatch(5,1)"><div class="egg">🥚</div><b>Forest Egg</b><br>✨5 ×1</button><button onclick="hatch(10,1)"><div class="egg">🌈</div><b>Shining Egg</b><br>✨10 ×1</button><button onclick="hatch(5,5)"><div class="egg">🥚🥚</div><b>Forest ×5</b><br>✨25</button><button onclick="hatch(10,5)"><div class="egg">🌈🌈</div><b>Shining ×5</b><br>✨50</button></div></section><section id="quiz" class="panel hide"><h2>🧠 Animal Quiz</h2><div id="quizbox"></div></section><section id="party" class="panel hide"><h2>🎉 Animal Party</h2><p>같은 동물 두 장을 맞히면 ✨ +3</p><div id="partygrid" class="grid"></div></section><section id="rescue" class="panel hide"><h2>🛟 Animal Rescue</h2><p id="rescuehelp"></p><div id="rescuegrid" class="grid"></div></section><section id="quest" class="panel hide"><h2>🎯 Quests</h2><div id="questbox"></div></section><section id="book" class="panel hide"><h2>📖 My Discovery Book</h2><div id="grid" class="grid"></div></section></main><div id="modal" class="modal hide"><div class="box"><div id="micon" class="big"></div><h2 id="mname"></h2><p id="mtext"></p><div id="mextra"></div><br><button onclick="closeM()">OK</button></div></div><script>let lang=localStorage.saLang||'ko',light=+(localStorage.saLight||40),owned=JSON.parse(localStorage.saOwned||'[]'),qdone=+(localStorage.saQ||0),pick=null,lock=false;const animals=[['범고래','Orca','🐋'],['대왕고래','Blue Whale','🐋'],['일각고래','Narwhal','🐋'],['돌고래','Dolphin','🐬'],['고래상어','Whale Shark','🦈'],['복어','Pufferfish','🐡'],['문어','Octopus','🐙'],['바다거북','Sea Turtle','🐢'],['황제펭귄','Emperor Penguin','🐧'],['북극곰','Polar Bear','🐻‍❄️'],['호랑이','Tiger','🐯'],['사자','Lion','🦁'],['치타','Cheetah','🐆'],['늑대','Wolf','🐺'],['여우','Fox','🦊'],['판다','Panda','🐼'],['코끼리','Elephant','🐘'],['기린','Giraffe','🦒'],['얼룩말','Zebra','🦓'],['코뿔소','Rhino','🦏'],['하마','Hippo','🦛'],['고릴라','Gorilla','🦍'],['오랑우탄','Orangutan','🦧'],['캥거루','Kangaroo','🦘'],['코알라','Koala','🐨'],['나무늘보','Sloth','🦥'],['비버','Beaver','🦫'],['수달','Otter','🦦'],['고슴도치','Hedgehog','🦔'],['라쿤','Raccoon','🦝'],['홍학','Flamingo','🦩'],['공작','Peacock','🦚'],['앵무새','Parrot','🦜'],['올빼미','Owl','🦉'],['악어','Crocodile','🐊'],['카멜레온','Chameleon','🦎'],['킹코브라','King Cobra','🐍'],['청개구리','Tree Frog','🐸'],['왕나비','Monarch','🦋'],['꿀벌','Honey Bee','🐝']];const qs=[['지구에서 가장 큰 동물은?','Largest animal on Earth?',['대왕고래','코끼리','기린'],['Blue whale','Elephant','Giraffe']],['문어의 팔은 몇 개?','How many arms does an octopus have?',['8개','6개','10개'],['8','6','10']],['박쥐는 어떤 동물?','What kind of animal is a bat?',['포유류','새','파충류'],['Mammal','Bird','Reptile']],['고래상어는 무엇?','What is a whale shark?',['상어','고래','돌고래'],['Shark','Whale','Dolphin']],['낙타 혹에 주로 저장되는 것은?','What is mainly stored in a camel hump?',['지방','물','공기'],['Fat','Water','Air']]];const $=x=>document.getElementById(x),T=(a,b)=>lang==='ko'?a:b;function save(){localStorage.saLang=lang;localStorage.saLight=light;localStorage.saOwned=JSON.stringify(owned);localStorage.saQ=qdone;render()}function render(){$('light').textContent=light;$('lang').textContent=lang==='ko'?'English':'한국어';$('title').textContent=T('선샤인 애니멀즈','SUNSHINE ANIMALS');$('sub').textContent=T('빛을 모으고 알을 깨워 동물을 발견하세요!','Collect light, hatch eggs, discover animals!');$('count').textContent=T('도감 '+owned.length+'/'+animals.length,'Collection '+owned.length+'/'+animals.length);$('grid').innerHTML=animals.map((a,i)=>`<div class="card ${owned.includes(i)?'':'locked'}"><div class="animal">${owned.includes(i)?a[2]:'❔'}</div><b>${owned.includes(i)?a[lang==='ko'?0:1]:'???'}</b></div>`).join('')}function toggleLang(){lang=lang==='ko'?'en':'ko';save()}function go(id){['eggs','quiz','party','rescue','quest','book'].forEach(x=>$(x).classList.toggle('hide',x!==id));if(id==='quiz')quiz();if(id==='party')party();if(id==='rescue')rescue();if(id==='quest')quest();render()}function hatch(c,n){let total=c*n;if(light<total)return need(total);light-=total;let got=[];for(let k=0;k<n;k++){let i=Math.floor(Math.random()*animals.length);got.push(i);if(!owned.includes(i))owned.push(i)}save();$('micon').textContent=got.map(i=>animals[i][2]).join(' ');$('mname').textContent=T('부화 성공!','Hatch complete!');$('mtext').textContent=got.map(i=>animals[i][lang==='ko'?0:1]).join(' · ');$('modal').classList.remove('hide')}function need(t){$('micon').textContent='✨';$('mname').textContent=T('자연의 빛이 부족해요','Need more Nature Light');$('mtext').textContent=T((t-light)+'개 더 필요해요.','Need '+(t-light)+' more.');$('mextra').innerHTML='<div class="choices"><button onclick="closeM();go(\'quiz\')">🧠 Quiz +5</button><button onclick="closeM();go(\'party\')">🎉 Party +3</button><button onclick="closeM();go(\'rescue\')">🛟 Rescue +4</button></div>';$('modal').classList.remove('hide')}function closeM(){$('modal').classList.add('hide');$('mextra').innerHTML=''}function quiz(){let q=qs[qdone%qs.length],opts=(lang==='ko'?q[2]:q[3]).map((v,i)=>[v,i]).sort(()=>Math.random()-.5);$('quizbox').innerHTML='<h3>'+(lang==='ko'?q[0]:q[1])+'</h3><div class="answers">'+opts.map(o=>`<button onclick="answer(${o[1]})">${o[0]}</button>`).join('')+'</div><p>✨ +5</p>'}function answer(i){if(i===0){light+=5;alert(T('정답! +5','Correct! +5'))}else alert(T('아쉬워요!','Try again!'));qdone++;save();quiz()}function party(){pick=null;let p=[...Array(6)].map(()=>Math.floor(Math.random()*animals.length)),arr=[...p,...p].sort(()=>Math.random()-.5);$('partygrid').innerHTML=arr.map(i=>`<div class="card" data-i="${i}" onclick="flip(this)"><div class="animal">❔</div></div>`).join('')}function flip(e){if(lock||e.dataset.done)return;let i=+e.dataset.i;e.firstChild.textContent=animals[i][2];if(!pick){pick=e;return}if(e===pick)return;if(e.dataset.i===pick.dataset.i){e.dataset.done=pick.dataset.done=1;light+=3;pick=null;save()}else{lock=true;let p=pick;setTimeout(()=>{p.firstChild.textContent=e.firstChild.textContent='❔';pick=null;lock=false},500)}}function rescue(){let t=Math.floor(Math.random()*animals.length),arr=[t,...[...Array(animals.length).keys()].filter(i=>i!==t).sort(()=>Math.random()-.5).slice(0,11)].sort(()=>Math.random()-.5);$('rescuehelp').textContent=T(animals[t][0]+'를 찾아주세요! ✨ +4','Find the '+animals[t][1]+'! ✨ +4');$('rescuegrid').innerHTML=arr.map(i=>`<div class="card" onclick="res(${i},${t})"><div class="animal">${animals[i][2]}</div></div>`).join('')}function res(i,t){if(i===t){light+=4;save();alert(T('구조 성공! +4','Rescue complete! +4'));rescue()}else alert(T('다른 동물이에요','Try another animal'))}function quest(){$('questbox').innerHTML='<p>🧠 '+T('퀴즈 완료','Quizzes')+': '+qdone+'/10</p><p>📖 '+T('동물 발견','Animals discovered')+': '+owned.length+'/20</p><p>✨ Nature Light: '+light+'/100</p>'}render()</script></body></html>
