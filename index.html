<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sunshine Animals</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;color:#173d32;background:linear-gradient(#073b5360,#0b433650),url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=2200&q=88') center/cover fixed;min-height:100vh}button{font:inherit;cursor:pointer}.top{position:fixed;z-index:30;inset:12px 12px auto;display:flex;justify-content:space-between}.logo,.pill{background:#fffef4f2;border:1px solid #fff;border-radius:18px;padding:10px 14px;font-weight:900;box-shadow:0 8px 25px #0003}.hud{display:grid;gap:5px}.lang{border:0;border-radius:18px;padding:8px;background:#123e38;color:#fff}.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:95px 15px 88px}.home{text-align:center;width:min(850px,96vw)}.tag,.hint{display:inline-block;background:#fffde9eb;border-radius:999px;padding:8px 13px;font-weight:800}.home h1{font-size:clamp(34px,5vw,64px);text-shadow:0 2px #fff,0 5px 22px #fff;margin:14px}.showcase{display:flex;justify-content:center;align-items:end;gap:8px;height:170px;margin:8px auto -15px;overflow:hidden}.showcase img{width:120px;height:145px;object-fit:cover;border-radius:55% 55% 22px 22px;border:4px solid #fff;box-shadow:0 10px 30px #0005}.showcase img:nth-child(2),.showcase img:nth-child(5){height:125px;width:105px}.activities{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:18px 0}.activity,.eggCard{border:1px solid #fff;background:#fffef0ed;border-radius:20px;padding:14px;box-shadow:0 10px 30px #0003}.eggs{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:540px;margin:auto}.eggCard{min-height:220px}.aurora{border:2px solid #b85cff;background:#f7effff2}.egg3d{width:118px;height:145px;margin:8px auto 12px;border-radius:50% 50% 46% 46%/58% 58% 42% 42%;position:relative;box-shadow:inset -18px -18px 28px #9d7b5b55,inset 15px 12px 22px #fff,0 15px 24px #0003;transition:.2s}.egg3d:after{content:'';position:absolute;left:24px;top:20px;width:30px;height:48px;border-radius:50%;background:#fff9;filter:blur(2px)}.pearlEgg{background:radial-gradient(circle at 32% 25%,#fff,#f8ecd5 34%,#d8c3a1 70%,#bca37d)}.auroraEgg{background:radial-gradient(circle at 30% 24%,#fff,#9ef8e7 22%,#8ba7ff 44%,#d27aff 68%,#ff91cb);box-shadow:inset -18px -18px 30px #5520a055,inset 15px 12px 22px #fff,0 0 30px #c75cffaa,0 15px 24px #0003}.eggCard:hover .egg3d{transform:translateY(-5px) scale(1.04)}.bottom{position:fixed;z-index:35;bottom:10px;left:50%;transform:translateX(-50%);display:flex;background:#f8fff8f2;border-radius:18px;padding:5px;max-width:96vw;overflow:auto}.bottom button{border:0;background:transparent;padding:10px;white-space:nowrap;font-weight:800}.screen,.modal{position:fixed;z-index:40;inset:0;background:#071f1ab8;backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:65px 14px 80px}.modal{z-index:60}.hide{display:none!important}.panel,.result{width:min(820px,96vw);max-height:84vh;overflow:auto;background:#fffffff5;border:7px solid #fff;border-radius:28px;padding:20px;box-shadow:0 25px 80px #0008}.result{width:min(720px,96vw);text-align:center}.back,.action{border:1px solid #cfe4da;background:white;border-radius:14px;padding:11px 15px;font-weight:800}.hatchMenu{text-align:center}.hatchChoices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hatchChoice{border:2px solid #dcece4;background:#fff;border-radius:22px;padding:20px}.hatchChoice.five{border-color:#b978ff;background:#f9f0ff}.num{font-size:36px;font-weight:1000}.hatchbox{text-align:center;background:linear-gradient(#effff3,#fffbd7);border-radius:22px;padding:28px}.hatchEgg{margin:18px auto;animation:shake 1.4s infinite}@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:11px}.card{border:3px solid #58a966;background:#fff;border-radius:19px;padding:7px;text-align:center;overflow:hidden}.animalImg{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:13px;background:linear-gradient(135deg,#dfece5,#f8fff9)}.locked .animalImg{filter:blur(10px) grayscale(1);opacity:.38}.tier0{border-color:#58a966}.tier1{border-color:#4da8e8;box-shadow:0 0 18px #4da8e844}.tier2{border-color:#a95bea;box-shadow:0 0 20px #a95bea55}.tier3{border-color:#f2b82e;box-shadow:0 0 25px #f2b82e88}.tier4{border-color:#ff63d8;box-shadow:0 0 34px #9e64ffbb;background:linear-gradient(135deg,#fff,#fff0fb)}.heroImg{width:100%;height:min(48vh,430px);object-fit:cover;border-radius:18px}.fiveResults{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.fiveResults img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px}.answers{display:grid;gap:8px}.answers button{padding:13px;border:1px solid #d8e8df;background:#f8fff9;border-radius:14px}.partyBack{height:135px;display:flex;align-items:center;justify-content:center;font-size:42px;background:linear-gradient(135deg,#eafff4,#fff8c9)}.loading{display:flex;align-items:center;justify-content:center;aspect-ratio:1/1;background:linear-gradient(135deg,#e9f6ef,#fff);border-radius:13px;font-weight:800;color:#789}.rarity{display:block;font-size:12px;margin-top:4px}.resultCard{border-width:5px;border-style:solid;border-radius:24px;padding:10px}.resultCard h2{margin:8px}.spark{animation:pop .45s ease}@keyframes pop{from{transform:scale(.72);opacity:0}to{transform:scale(1);opacity:1}}@media(max-width:700px){.activities,.hatchChoices{grid-template-columns:1fr}.home h1{font-size:36px}.showcase{height:120px}.showcase img{width:78px;height:100px}.showcase img:nth-child(2),.showcase img:nth-child(5){width:68px;height:88px}.fiveResults{grid-template-columns:repeat(2,1fr)}.top{inset:7px 7px auto}.logo{font-size:12px}.egg3d{width:95px;height:120px}}</style></head><body><script src="game-data.js"></script><div class="top"><div class="logo">🌞 선샤인 애니멀즈<br><small>SUNSHINE ANIMALS</small></div><div class="hud"><div class="pill">✨ <span id="lightLabel">자연의 빛</span> <span id="light">53</span></div><button class="lang" onclick="toggleLang()">🌎 <span id="langBtn">English</span></button></div></div><main class="stage"><section class="home"><div class="tag" id="tag"></div><h1 id="hero"></h1><div class="showcase" id="showcase"></div><div class="hint" id="hint"></div><div class="activities"><button class="activity" onclick="openScreen('quiz')">🧠 <b>동물 퀴즈</b></button><button class="activity" onclick="openScreen('party')">🎉 <b>애니멀 파티</b></button><button class="activity" onclick="openScreen('rescue')">🛟 <b>구조대</b></button></div><div class="eggs"><button class="eggCard" onclick="openHatchMenu(5,false)"><b>PEARL</b><div class="egg3d pearlEgg"></div><strong>숲의 알</strong><div>✨ 5 / 1회</div></button><button class="eggCard aurora" onclick="openHatchMenu(10,true)"><b>AURORA</b><div class="egg3d auroraEgg"></div><strong>빛나는 알</strong><div>✨ 10 / 1회 · 희귀 UP</div></button></div></section></main><nav class="bottom"><button onclick="closeScreens()">🥚 알 부화</button><button onclick="openScreen('quiz')">🧠 퀴즈</button><button onclick="openScreen('party')">🎉 파티</button><button onclick="openScreen('rescue')">🛟 구조대</button><button onclick="openScreen('quest')">🎯 퀘스트</button><button onclick="openScreen('book')">📖 도감</button></nav><div id="screen" class="screen hide"><section class="panel"><button class="back" onclick="closeScreens()">←</button><div id="content"></div></section></div><div id="modal" class="modal hide"><section class="result"><div id="rbody"></div><button class="action" onclick="closeModal()">확인</button></section></div><script>const A=GAME_DATA.animals,Q=GAME_DATA.quizzes,$=x=>document.getElementById(x);let lang=localStorage.sunLang||'ko',light=+(localStorage.sunLight||53),owned=JSON.parse(localStorage.sunOwned||'[]'),qdone=+(localStorage.sunQ||0),pair=null,busy=false;const T=(a,b)=>lang==='ko'?a:b;const imgCache=JSON.parse(localStorage.sunImgCache||'{}');const titleFix={'Seal':'Pinniped','Crane':'Crane (bird)','Ant':'Ant','Bat':'Bat','Fox':'Fox','Otter':'Otter','Gecko':'Gecko','Python':'Pythonidae','Moose':'Moose','Kiwi':'Kiwi (bird)','Emu':'Emu','Owl':'Owl','Parrot':'Parrot','Toucan':'Toucan','Ladybug':'Coccinellidae','Dragonfly':'Dragonfly','Manta Ray':'Manta ray'};async function resolveImg(i){if(imgCache[i])return imgCache[i];let title=titleFix[A[i][1]]||A[i][1],u='https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages&pithumbsize=900&titles='+encodeURIComponent(title);try{let j=await fetch(u).then(r=>r.json()),p=Object.values(j.query.pages)[0],src=p.thumbnail&&p.thumbnail.source;if(src){imgCache[i]=src;localStorage.sunImgCache=JSON.stringify(imgCache);return src}}catch(e){}return ''}function photo(i,cl='animalImg'){return '<div class="loading photoSlot" data-i="'+i+'" data-cl="'+cl+'">'+T('불러오는 중','Loading')+'</div>'}async function hydrate(root=document){let slots=[...root.querySelectorAll('.photoSlot')];for(let s of slots){let i=+s.dataset.i,src=await resolveImg(i);if(!s.isConnected)continue;if(src){let im=document.createElement('img');im.className=s.dataset.cl;im.src=src;im.alt=A[i][1];im.loading='lazy';s.replaceWith(im)}else{s.textContent=A[i][lang==='ko'?0:1];s.style.fontSize='13px'}}}function tier(i){return i>=110?4:i>=100?3:i>=82?2:i>=55?1:0}function tierName(i){return T(['일반','희귀','특별','전설','환상'][tier(i)],['Common','Rare','Special','Legendary','Mythic'][tier(i)])}function save(){localStorage.sunLang=lang;localStorage.sunLight=light;localStorage.sunOwned=JSON.stringify(owned);localStorage.sunQ=qdone;render()}function render(){$('light').textContent=light;$('langBtn').textContent=lang==='ko'?'English':'한국어';$('lightLabel').textContent=T('자연의 빛','Nature Light');$('tag').textContent='✨ '+T('자연의 빛이 새로운 생명을 깨워요','Nature Light awakens new life');$('hero').innerHTML=T('빛 속에서 깨어날<br>동물 친구를 만나보세요','Meet animal friends<br>awakening in the light');$('hint').textContent=T('알을 선택하고 1회 또는 5회 연속 부화하세요.','Choose an egg and hatch 1 or 5 at once.');$('showcase').innerHTML=[0,39,34,57,36,25].map(i=>photo(i)).join('');hydrate($('showcase'))}function toggleLang(){lang=lang==='ko'?'en':'ko';save()}function closeScreens(){$('screen').classList.add('hide')}function openScreen(t){$('screen').classList.remove('hide');({quiz,party,rescue,quest,book}[t]||(()=>{}))()}function eggHtml(u,cl='egg3d hatchEgg'){return '<div class="'+cl+' '+(u?'auroraEgg':'pearlEgg')+'"></div>'}function openHatchMenu(c,u){$('screen').classList.remove('hide');$('content').innerHTML='<div class="hatchMenu">'+eggHtml(u,'egg3d')+'<h2>'+T(u?'빛나는 알':'숲의 알',u?'Shining Egg':'Forest Egg')+'</h2><p>'+T('부화 방법을 선택하세요','Choose a hatch option')+'</p><div class="hatchChoices"><button class="hatchChoice" onclick="hatch('+c+',1,'+u+')"><div class="num">1×</div><b>'+T('1회 부화','Single Hatch')+'</b><p>✨ '+c+'</p></button><button class="hatchChoice five" onclick="hatch('+c+',5,'+u+')"><div class="num">5×</div><b>'+T('5회 연속 부화','5 Consecutive Hatches')+'</b><p>✨ '+c*5+'</p></button></div></div>'}function pickAnimal(u){let r=Math.random(),t=u?(r<.08?4:r<.20?3:r<.42?2:r<.70?1:0):(r<.03?4:r<.11?3:r<.28?2:r<.55?1:0),s=[0,55,82,100,110][t],e=[55,82,100,110,115][t];return s+Math.floor(Math.random()*(e-s))}function hatch(c,n,u){if(light<c*n)return need(c*n-light);light-=c*n;let g=[];for(let k=0;k<n;k++){let x=pickAnimal(u);g.push(x);if(!owned.includes(x))owned.push(x)}save();$('content').innerHTML='<div class="hatchbox"><h3>'+T(n===5?'5회 연속 부화 시작!':'부화 직전!',n===5?'5-Hatch Sequence!':'Ready to Hatch!')+'</h3>'+eggHtml(u)+'<b>'+T('알을 눌러 부화시키세요','Tap the egg to hatch')+'</b></div>';$('content').querySelector('.hatchEgg').onclick=()=>showResult(g)}function showResult(g){if(g.length===5){$('rbody').innerHTML='<h2>✨ '+T('5회 연속 부화 결과','5-Hatch Results')+'</h2><div class="fiveResults spark">'+g.map(i=>'<div class="card tier'+tier(i)+'">'+photo(i)+'<b>'+A[i][lang==='ko'?0:1]+'</b><span class="rarity">★ '+tierName(i)+'</span></div>').join('')+'</div>'}else{let i=g[0];$('rbody').innerHTML='<p>🌱 '+T('새로운 동물 카드 발견!','Animal card discovered!')+'</p><div class="resultCard tier'+tier(i)+' spark">'+photo(i,'heroImg')+'<h2>'+A[i][lang==='ko'?0:1]+'</h2><b>★ '+tierName(i)+'</b></div>'}$('modal').classList.remove('hide');hydrate($('rbody'))}function need(n){$('rbody').innerHTML='<h2>✨ '+T('자연의 빛이 '+n+'개 부족해요','Need '+n+' more Nature Light')+'</h2><div class="answers"><button onclick="closeModal();openScreen(\'quiz\')">🧠 Quiz +5</button><button onclick="closeModal();openScreen(\'party\')">🎉 Party +3</button><button onclick="closeModal();openScreen(\'rescue\')">🛟 Rescue +4</button></div>';$('modal').classList.remove('hide')}function closeModal(){$('modal').classList.add('hide')}function quiz(){let q=Q[qdone%Q.length],o=(lang==='ko'?[q[2],q[3],q[4]]:[q[5],q[6],q[7]]).map((v,i)=>[v,i]).sort(()=>Math.random()-.5);$('content').innerHTML='<h2>🧠 '+T('동물 퀴즈','Animal Quiz')+' '+(qdone%50+1)+'/50</h2><h3>'+(lang==='ko'?q[0]:q[1])+'</h3><div class="answers">'+o.map(x=>'<button onclick="answer('+x[1]+')">'+x[0]+'</button>').join('')+'</div>'}function answer(i){if(i===0){light+=5;alert(T('정답! 자연의 빛 +5','Correct! Nature Light +5'))}else alert(T('아쉬워요!','Nice try!'));qdone++;save();quiz()}function party(){pair=null;let ids=[...Array(6)].map(()=>Math.floor(Math.random()*A.length)),d=[...ids,...ids].sort(()=>Math.random()-.5);$('content').innerHTML='<h2>🎉 Animal Party</h2><div class="grid">'+d.map(i=>'<button class="card" data-i="'+i+'" onclick="flip(this)"><div class="partyBack">?</div></button>').join('')+'</div>'}function flip(e){if(busy||e.dataset.done)return;let i=+e.dataset.i;e.innerHTML=photo(i);hydrate(e);if(!pair){pair=e;return}if(pair===e)return;if(pair.dataset.i===e.dataset.i){pair.dataset.done=e.dataset.done=1;light+=3;pair=null;save()}else{busy=true;let p=pair;setTimeout(()=>{p.innerHTML=e.innerHTML='<div class="partyBack">?</div>';pair=null;busy=false},1000)}}function rescue(){let t=Math.floor(Math.random()*A.length),ids=[t,...[...Array(A.length).keys()].filter(i=>i!==t).sort(()=>Math.random()-.5).slice(0,8)].sort(()=>Math.random()-.5);$('content').innerHTML='<h2>🛟 '+T('애니멀 구조대','Animal Rescue')+'</h2><h3>'+T(A[t][0]+'를 찾아주세요!','Find the '+A[t][1]+'!')+'</h3><div class="grid">'+ids.map(i=>'<button class="card tier'+tier(i)+'" onclick="doRescue('+i+','+t+')">'+photo(i)+'</button>').join('')+'</div>';hydrate($('content'))}function doRescue(i,t){if(i===t){light+=4;save();alert(T('구조 성공! 자연의 빛 +4','Rescue complete! +4'));rescue()}else alert(T('다른 동물이에요','Try another animal'))}function quest(){$('content').innerHTML='<h2>🎯 '+T('특별 퀘스트','Quests')+'</h2><h3>🧠 '+qdone+'/50</h3><h3>📖 '+owned.length+'/115</h3><h3>✨ '+light+'/100</h3>'}function book(){$('content').innerHTML='<h2>📖 '+T('나의 도감','My Discovery Book')+' · '+owned.length+'/115</h2><div class="grid">'+A.map((a,i)=>'<div class="card tier'+tier(i)+' '+(owned.includes(i)?'':'locked')+'">'+photo(i)+'<b>'+(owned.includes(i)?a[lang==='ko'?0:1]:'???')+'</b><span class="rarity">★ '+tierName(i)+'</span></div>').join('')+'</div>';hydrate($('content'))}render();</script></body></html>
