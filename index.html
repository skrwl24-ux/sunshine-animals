<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sunshine Animals</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;color:#173d32;background:linear-gradient(#073b5360,#0b433650),url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=2200&q=88') center/cover fixed;min-height:100vh}button{font:inherit;cursor:pointer}.top{position:fixed;z-index:20;inset:12px 12px auto;display:flex;justify-content:space-between}.logo,.pill{background:#fffef4ef;border-radius:18px;padding:10px 14px;font-weight:900;box-shadow:0 8px 25px #0003}.hud{display:grid;gap:5px}.lang{border:0;border-radius:18px;padding:8px;background:#123e38;color:#fff}.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:100px 15px}.home{text-align:center;width:min(760px,94vw)}.tag,.hint{display:inline-block;background:#fffde9e8;border-radius:999px;padding:8px 13px;font-weight:800}.home h1{font-size:clamp(34px,5vw,64px);text-shadow:0 2px #fff;margin:14px}.activities{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:18px 0}.activity,.eggCard{border:1px solid #fff;background:#fffef0ed;border-radius:20px;padding:14px;box-shadow:0 10px 30px #0003}.eggs{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:500px;margin:auto}.egg{font-size:82px}.aurora{border:2px solid #b85cff;background:#f7effff2}.bottom{position:fixed;z-index:25;bottom:10px;left:50%;transform:translateX(-50%);display:flex;background:#f8fff8f2;border-radius:18px;padding:5px;max-width:96vw;overflow:auto}.bottom button{border:0;background:transparent;padding:10px;white-space:nowrap;font-weight:800}.screen,.modal{position:fixed;z-index:30;inset:0;background:#071f1aaf;display:flex;align-items:center;justify-content:center;padding:65px 14px 80px}.modal{z-index:50}.hide{display:none!important}.panel,.result{width:min(760px,95vw);max-height:84vh;overflow:auto;background:#fffffff2;border:7px solid #fff;border-radius:28px;padding:20px;box-shadow:0 25px 80px #0008}.result{width:min(680px,95vw);text-align:center}.back,.action{border:1px solid #cfe4da;background:white;border-radius:14px;padding:11px 15px;font-weight:800}.hatchMenu{text-align:center}.hatchChoices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hatchChoice{border:2px solid #dcece4;background:#fff;border-radius:22px;padding:20px}.hatchChoice.five{border-color:#b978ff;background:#f9f0ff}.num{font-size:36px;font-weight:1000}.hatchbox{text-align:center;background:linear-gradient(#effff3e8,#fffbd7e8);border-radius:22px;padding:28px}.hatchEgg{font-size:120px;animation:float 1.7s infinite}@keyframes float{50%{transform:translateY(-10px) scale(1.03)}}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:11px}.card{border:3px solid #58a966;background:#fff;border-radius:19px;padding:7px;text-align:center;overflow:hidden}.animalImg{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:13px;background:#e8eee9}.locked .animalImg{filter:blur(9px) grayscale(1);opacity:.45}.tier0{border-color:#58a966}.tier1{border-color:#4da8e8;box-shadow:0 0 18px #4da8e844}.tier2{border-color:#a95bea;box-shadow:0 0 20px #a95bea55}.tier3{border-color:#f2b82e;box-shadow:0 0 25px #f2b82e77}.tier4{border-color:#ff63d8;box-shadow:0 0 30px #9e64ff99;background:linear-gradient(135deg,#fff,#fff0fb)}.heroImg{width:100%;max-height:430px;object-fit:cover;border-radius:18px}.fiveResults{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.fiveResults img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px}.answers{display:grid;gap:8px}.answers button{padding:13px;border:1px solid #d8e8df;background:#f8fff9;border-radius:14px}.partyBack{height:130px;display:flex;align-items:center;justify-content:center;font-size:44px;background:linear-gradient(135deg,#eafff4,#fff8c9)}@media(max-width:700px){.activities,.hatchChoices{grid-template-columns:1fr}.home h1{font-size:36px}.egg{font-size:64px}.fiveResults{grid-template-columns:repeat(5,1fr)}.top{inset:7px 7px auto}.logo{font-size:12px}}</style></head><body><script src="game-data.js"></script><div class="top"><div class="logo">🌞 선샤인 애니멀즈<br><small>SUNSHINE ANIMALS</small></div><div class="hud"><div class="pill">✨ <span id="lightLabel">자연의 빛</span> <span id="light">53</span></div><button class="lang" onclick="toggleLang()">🌎 <span id="langBtn">English</span></button></div></div><main class="stage"><section class="home"><div class="tag" id="tag"></div><h1 id="hero"></h1><div class="hint" id="hint"></div><div class="activities"><button class="activity" onclick="openScreen('quiz')">🧠 <b>동물 퀴즈</b></button><button class="activity" onclick="openScreen('party')">🎉 <b>애니멀 파티</b></button><button class="activity" onclick="openScreen('rescue')">🛟 <b>구조대</b></button></div><div class="eggs"><button class="eggCard" onclick="openHatchMenu(5,false,'🥚')"><b>PEARL</b><div class="egg">🥚</div><strong>숲의 알</strong></button><button class="eggCard aurora" onclick="openHatchMenu(10,true,'🌈')"><b>AURORA</b><div class="egg">🌈</div><strong>빛나는 알</strong></button></div></section></main><nav class="bottom"><button onclick="closeScreens()">🥚 알 부화</button><button onclick="openScreen('quiz')">🧠 퀴즈</button><button onclick="openScreen('party')">🎉 파티</button><button onclick="openScreen('rescue')">🛟 구조대</button><button onclick="openScreen('quest')">🎯 퀘스트</button><button onclick="openScreen('book')">📖 도감</button></nav><div id="screen" class="screen hide"><section class="panel"><button class="back" onclick="closeScreens()">←</button><div id="content"></div></section></div><div id="modal" class="modal hide"><section class="result"><div id="rbody"></div><button class="action" onclick="closeModal()">확인</button></section></div><script>const A=GAME_DATA.animals,Q=GAME_DATA.quizzes,$=x=>document.getElementById(x);let lang=localStorage.sunLang||'ko',light=+(localStorage.sunLight||53),owned=JSON.parse(localStorage.sunOwned||'[]'),qdone=+(localStorage.sunQ||0),pair=null,busy=false;const T=(a,b)=>lang==='ko'?a:b;function img(i){let q=encodeURIComponent(A[i][1]+' animal wildlife');return 'https://loremflickr.com/640/640/'+q+'?lock='+(4100+i)}function tier(i){return i>=110?4:i>=100?3:i>=82?2:i>=55?1:0}function tierName(i){return T(['일반','희귀','특별','전설','환상'][tier(i)],['Common','Rare','Special','Legendary','Mythic'][tier(i)])}function photo(i,cl='animalImg'){return '<img class="'+cl+'" src="'+img(i)+'" alt="'+A[i][1]+'" loading="lazy" onerror="this.style.display=\'none\';this.insertAdjacentHTML(\'afterend\',\'<div style=font-size:60px>'+A[i][2]+'</div>\')">'}function save(){localStorage.sunLang=lang;localStorage.sunLight=light;localStorage.sunOwned=JSON.stringify(owned);localStorage.sunQ=qdone;render()}function render(){$('light').textContent=light;$('langBtn').textContent=lang==='ko'?'English':'한국어';$('lightLabel').textContent=T('자연의 빛','Nature Light');$('tag').textContent='✨ '+T('자연의 빛이 새로운 생명을 깨워요','Nature Light awakens new life');$('hero').innerHTML=T('빛 속에서 깨어날<br>동물 친구를 만나보세요','Meet animal friends<br>awakening in the light');$('hint').textContent=T('알을 선택하고 1회 또는 5회 연속 부화하세요.','Choose an egg and hatch 1 or 5 at once.')}function toggleLang(){lang=lang==='ko'?'en':'ko';save()}function closeScreens(){$('screen').classList.add('hide')}function openScreen(t){$('screen').classList.remove('hide');({quiz,party,rescue,quest,book}[t]||(()=>{}))()}function openHatchMenu(c,u,ic){$('screen').classList.remove('hide');$('content').innerHTML='<div class="hatchMenu"><div class="egg">'+ic+'</div><h2>'+T(u?'빛나는 알':'숲의 알',u?'Shining Egg':'Forest Egg')+'</h2><div class="hatchChoices"><button class="hatchChoice" onclick="hatch('+c+',1,'+u+',\''+ic+'\')"><div class="num">1×</div><b>'+T('1회 부화','Single Hatch')+'</b><p>✨ '+c+'</p></button><button class="hatchChoice five" onclick="hatch('+c+',5,'+u+',\''+ic+'\')"><div class="num">5×</div><b>'+T('5회 연속 부화','5 Consecutive Hatches')+'</b><p>✨ '+c*5+'</p></button></div></div>'}function pickAnimal(u){let r=Math.random(),t=u?(r<.08?4:r<.20?3:r<.42?2:r<.70?1:0):(r<.03?4:r<.11?3:r<.28?2:r<.55?1:0),s=[0,55,82,100,110][t],e=[55,82,100,110,115][t];return s+Math.floor(Math.random()*(e-s))}function hatch(c,n,u,ic){if(light<c*n)return need(c*n-light);light-=c*n;let g=[];for(let k=0;k<n;k++){let x=pickAnimal(u);g.push(x);if(!owned.includes(x))owned.push(x)}save();$('content').innerHTML='<div class="hatchbox"><h3>'+T(n===5?'5회 연속 부화!':'부화 직전!',n===5?'5-Hatch Sequence!':'Ready to Hatch!')+'</h3><div class="hatchEgg">'+ic+'</div><b>'+T('알을 눌러주세요','Tap the egg')+'</b></div>';$('content').querySelector('.hatchEgg').onclick=()=>showResult(g)}function showResult(g){if(g.length===5){$('rbody').innerHTML='<h2>✨ '+T('5회 연속 부화 결과','5-Hatch Results')+'</h2><div class="fiveResults">'+g.map(i=>'<div class="card tier'+tier(i)+'">'+photo(i)+'<b>'+A[i][lang==='ko'?0:1]+'</b><small>★ '+tierName(i)+'</small></div>').join('')+'</div>'}else{let i=g[0];$('rbody').innerHTML='<p>🌱 '+T('새로운 동물 카드 발견!','Animal card discovered!')+'</p><div class="resultCard tier'+tier(i)+'">'+photo(i,'heroImg')+'<h2>'+A[i][lang==='ko'?0:1]+'</h2><b>★ '+tierName(i)+'</b></div>'}$('modal').classList.remove('hide')}function need(n){$('rbody').innerHTML='<h2>✨ '+T('자연의 빛이 '+n+'개 부족해요','Need '+n+' more Nature Light')+'</h2><div class="answers"><button onclick="closeModal();openScreen(\'quiz\')">🧠 Quiz +5</button><button onclick="closeModal();openScreen(\'party\')">🎉 Party +3</button><button onclick="closeModal();openScreen(\'rescue\')">🛟 Rescue +4</button></div>';$('modal').classList.remove('hide')}function closeModal(){$('modal').classList.add('hide')}function quiz(){let q=Q[qdone%Q.length],o=(lang==='ko'?[q[2],q[3],q[4]]:[q[5],q[6],q[7]]).map((v,i)=>[v,i]).sort(()=>Math.random()-.5);$('content').innerHTML='<h2>🧠 '+T('동물 퀴즈','Animal Quiz')+' '+(qdone%50+1)+'/50</h2><h3>'+(lang==='ko'?q[0]:q[1])+'</h3><div class="answers">'+o.map(x=>'<button onclick="answer('+x[1]+')">'+x[0]+'</button>').join('')+'</div>'}function answer(i){if(i===0){light+=5;alert(T('정답! +5','Correct! +5'))}else alert(T('아쉬워요!','Nice try!'));qdone++;save();quiz()}function party(){pair=null;let ids=[...Array(6)].map(()=>Math.floor(Math.random()*A.length)),d=[...ids,...ids].sort(()=>Math.random()-.5);$('content').innerHTML='<h2>🎉 Animal Party</h2><div class="grid">'+d.map(i=>'<button class="card" data-i="'+i+'" onclick="flip(this)"><div class="partyBack">❔</div></button>').join('')+'</div>'}function flip(e){if(busy||e.dataset.done)return;let i=+e.dataset.i;e.innerHTML=photo(i);if(!pair){pair=e;return}if(pair===e)return;if(pair.dataset.i===e.dataset.i){pair.dataset.done=e.dataset.done=1;light+=3;pair=null;save()}else{busy=true;let p=pair;setTimeout(()=>{p.innerHTML=e.innerHTML='<div class="partyBack">❔</div>';pair=null;busy=false},750)}}function rescue(){let t=Math.floor(Math.random()*A.length),ids=[t,...[...Array(A.length).keys()].filter(i=>i!==t).sort(()=>Math.random()-.5).slice(0,8)].sort(()=>Math.random()-.5);$('content').innerHTML='<h2>🛟 '+T('애니멀 구조대','Animal Rescue')+'</h2><h3>'+T(A[t][0]+'를 찾아주세요!','Find the '+A[t][1]+'!')+'</h3><div class="grid">'+ids.map(i=>'<button class="card tier'+tier(i)+'" onclick="doRescue('+i+','+t+')">'+photo(i)+'</button>').join('')+'</div>'}function doRescue(i,t){if(i===t){light+=4;save();alert(T('구조 성공! +4','Rescue complete! +4'));rescue()}else alert(T('다른 동물이에요','Try another animal'))}function quest(){$('content').innerHTML='<h2>🎯 '+T('특별 퀘스트','Quests')+'</h2><h3>🧠 '+qdone+'/50</h3><h3>📖 '+owned.length+'/115</h3><h3>✨ '+light+'/100</h3>'}function book(){$('content').innerHTML='<h2>📖 '+T('나의 도감','My Book')+' · '+owned.length+'/115</h2><div class="grid">'+A.map((a,i)=>'<div class="card tier'+tier(i)+' '+(owned.includes(i)?'':'locked')+'">'+photo(i)+'<b>'+(owned.includes(i)?a[lang==='ko'?0:1]:'???')+'</b><br><small>★ '+tierName(i)+'</small></div>').join('')+'</div>'}render()</script></body></html>
